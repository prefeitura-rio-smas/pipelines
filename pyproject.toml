[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipelines-arcgis"
version = "0.1.0"
description = "Pipelines for ArcGIS integration"
requires-python = ">=3.13"
dependencies = [
    "prefect==3.6.29",
    "prefect-docker>=0.6.0",
    "pandas>=2.2.0",
    "geopandas>=1.0.0",
    "google-cloud-bigquery>=3.0.0",
    "google-cloud-storage>=2.17.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.30.0",
    "shapely>=2.0.0",
    "prefect-dbt>=0.6.0",
    "dbt-bigquery>=1.8.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "black>=23.0.0",
]

[tool.uv]
override-dependencies = [
    "black>=26.3.1",
    "click>=8.3.3",
    "cryptography>=46.0.7",
    "h2>=4.4.1",
    "idna>=3.15",
    "mako>=1.3.12",
    "msgpack>=1.2.1",
    "pyasn1>=0.6.4",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "requests>=2.33.0",
    "setuptools>=83.0.0",
    "sqlparse>=0.6.0",
    "starlette>=1.3.1",
    "urllib3>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pipelines*"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
select = [
    "F", "E", "W", "I001",
    "S",
]
ignore = ["E501"]
unfixable = ["ERA"]
target-version = "py313"

[tool.ruff.isort]
known-first-party = ["pipelines", "tests"]
force-sort-within-sections = true
