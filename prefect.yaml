          GCP_CREDENTIALS: "{{ $GCP_CREDENTIALS }}"
          SIURB_URL: "{{ $SIURB_URL }}"
          SIURB_USER: "{{ $SIURB_USER }}"
          SIURB_PWD: "{{ $SIURB_PWD }}"
    tags: ["staging", "bolsa-familia"]

  - name: bolsa-familia-prod
