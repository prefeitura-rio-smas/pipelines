version: 2
seeds:
  - name: creas_campos
    description: Mapeia os rótulos dos formulários do CREAS para os campos de resposta usados em int_perfil_creas.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [titulo, rotulo]
    columns:
      - name: titulo
        description: Título do formulário de origem.
        data_tests: [not_null]
      - name: rotulo
        description: Rótulo da pergunta no formulário de origem.
        data_tests: [not_null]
      - name: coluna
        description: Nome do campo de resposta no perfil do CREAS.
        data_tests: [not_null]
      - name: assunto
        description: Assunto do perfil ao qual o campo pertence.
