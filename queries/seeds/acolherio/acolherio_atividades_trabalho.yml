version: 2
seeds:
  - name: acolherio_atividades_trabalho
    description: Catálogo inferido de atividades remuneradas do cadastro do AcolheRio, usado para traduzir os códigos em int_usuarios.
    columns:
      - name: codigo
        description: Código da atividade remunerada no cadastro.
        data_tests: [not_null, unique]
      - name: descricao
        description: Rótulo legível da atividade.
        data_tests: [not_null]
      - name: fonte
        description: Arquivo de origem do mapeamento.
      - name: confianca
        description: Classificação da confiança do mapeamento.
