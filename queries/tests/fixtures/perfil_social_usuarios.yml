unit_tests:
  - name: perfil_social_preserva_respostas_e_ausencias
    description: >
      Distingue ausência de negativa, não infere indicadores a partir do texto,
      preserva usuários órfãos, deduplica itens e mantém códigos desconhecidos.
    model: int_perfil_social_usuarios
    given:
      - input: ref('raw_usuarios_detalhes')
        format: sql
        rows: |
          select * from unnest([
            struct(1 as id_paciente, 'N' as violacao_direito),
            (2, '20'), (3, ''), (4, 'N')
          ])
      - input: ref('raw_usuarios_saude_mental')
        format: sql
        rows: |
          select * from unnest([
            struct(1 as id_paciente, 'N' as flag_recebe_beneficio, 'N' as flag_deficiencia, '1' as tipo_moradia),
            (2, 'S', 'S', '5'), (3, '', '', 'E')
          ])
      - input: ref('raw_usuarios_informacoes_medicas')
        format: sql
        rows: |
          select * from unnest([
            struct(1 as id_usuario, 'N' as flag_possui_comorbidade, ' texto preservado ' as descricao_comorbidades,
              date '2026-10-01' as data_informacao_comorbidades, ' local ' as local_tratamento_comorbidades,
              date '2026-09-01' as data_cadastro, 10 as id_unidade_cadastro),
            (2, 'S', '', date '2026-10-01', '', date '2026-09-01', 10),
            (3, '', 'texto sem indicador', null, null, null, null),
            (5, 'S', ' informação do usuário órfão ', null, null, null, null)
          ])
      - input: ref('int_usuarios_violacoes')
        format: sql
        rows: |
          select 2 as id_usuario, [struct('20' as codigo, 'Trabalho Infantil' as descricao, 'cadastro' as origem)] as violacoes
          union all
          select 4, [struct('11', 'MSE', 'evolucao')]
      - input: ref('int_beneficios_agregados')
        format: sql
        rows: |
          select 2 as id_usuario, [
            struct('5' as codigo, 'Bolsa Família' as descricao), ('5', 'Bolsa Família'),
            ('999', null), ('N', null), ('', null)
          ] as beneficio
      - input: ref('int_deficiencias_agregadas')
        format: sql
        rows: |
          select 2 as id_usuario, [
            struct('1' as codigo, 'Deficiência auditiva total' as descricao),
            ('1', 'Deficiência auditiva total'), ('999', null), ('N', null), ('', null)
          ] as deficiencia
    expect:
      rows:
        - {id_usuario: 1, flag_possui_violacao_direito: 'Não', flag_recebe_beneficio: 'Não', flag_deficiencia: 'Não', flag_situacao_rua: 'Não', flag_possui_comorbidade: 'Não', comorbidades: 'texto preservado', local_tratamento_comorbidades: 'local', beneficios: null, deficiencias: null}
        - {id_usuario: 2, flag_possui_violacao_direito: 'Sim', flag_recebe_beneficio: 'Sim', flag_deficiencia: 'Sim', flag_situacao_rua: 'Sim', flag_possui_comorbidade: 'Sim', comorbidades: null, local_tratamento_comorbidades: null, beneficios: 'Benefício não mapeado (código 999), Bolsa Família', deficiencias: 'Deficiência auditiva total, Deficiência não mapeada (código 999)'}
        - {id_usuario: 3, flag_possui_violacao_direito: 'Não Informado', flag_recebe_beneficio: 'Não Informado', flag_deficiencia: 'Não Informado', flag_situacao_rua: 'Não Informado', flag_possui_comorbidade: 'Não Informado', comorbidades: 'texto sem indicador', local_tratamento_comorbidades: null, beneficios: null, deficiencias: null}
        - {id_usuario: 4, flag_possui_violacao_direito: 'Sim', flag_recebe_beneficio: 'Não Informado', flag_deficiencia: 'Não Informado', flag_situacao_rua: 'Não Informado', flag_possui_comorbidade: 'Não Informado', comorbidades: null, local_tratamento_comorbidades: null, beneficios: null, deficiencias: null}
        - {id_usuario: 5, flag_possui_violacao_direito: 'Não Informado', flag_recebe_beneficio: 'Não Informado', flag_deficiencia: 'Não Informado', flag_situacao_rua: 'Não Informado', flag_possui_comorbidade: 'Sim', comorbidades: 'informação do usuário órfão', local_tratamento_comorbidades: null, beneficios: null, deficiencias: null}

  - name: servicos_preservam_familias_sem_vinculos_ativos
    description: Histórico cancelado permanece disponível; resumo não inclui cancelados nem perde IDs desconhecidos.
    model: int_servicos_familia_completos
    given:
      - input: ref('raw_familias_servicos_assistenciais')
        format: sql
        rows: |
          select * from unnest([
            struct(1 as id_familia, 1 as id_servico_assistencial, 10 as id_unidade,
              20 as id_login_cadastro, date '2026-01-01' as data_cadastro, cast(null as date) as data_cancelamento),
            (1, 1, 10, 20, date '2026-01-02', null),
            (1, 6, 10, 20, date '2026-01-01', date '2026-02-01'),
            (1, 999, 10, 20, date '2026-01-01', null),
            (2, 6, 10, 20, date '2026-01-01', date '2026-02-01')
          ])
    expect:
      rows:
        - {id_familia: 1, servicos_socioassistenciais: 'PAIF, Serviço não mapeado (ID 999)'}
        - {id_familia: 2, servicos_socioassistenciais: null}
