version: 2
models:
  - name: int_acolherio_atendimentos
    description: Seleção materializada de participações dos raws do AcolheRio com os rankings e filtros da busca programada.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [seq_atendimento, modulo, id_usuario, profissional_id]
    columns:
      - name: id_usuario
        data_tests: [not_null]
