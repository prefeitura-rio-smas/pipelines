version: 2
models:
  - name: int_acolherio_atendimentos
    description: Seleção de participações não canceladas por atendimento, módulo e profissional a partir dos raws do AcolheRio.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [seq_atendimento, modulo, id_usuario, profissional_id]
    columns:
      - name: id_usuario
        data_tests: [not_null]
