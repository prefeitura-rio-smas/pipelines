version: 2
models:
  - name: int_atendimentos_selecionados
    description: Seleção por atendimento e profissional a partir dos raws do AcolheRio, com os mesmos rankings da consulta programada.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [seq_atendimento, modulo, id_usuario, profissional_id]
    columns:
      - name: id_usuario
        data_tests: [not_null]
