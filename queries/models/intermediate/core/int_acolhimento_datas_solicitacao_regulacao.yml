version: 2
models:
  - name: int_acolhimento_datas_solicitacao_regulacao
    description: |
      Datas de solicitação e regulação associadas aos ciclos de acolhimento.
      Grão: uma linha por id_ciclo. Solicitações são relacionadas por paciente,
      data de atendimento e unidade; regulações por paciente, data de entrada
      prevista e unidade. A data de notificação é priorizada quando existe
      notificação ligada à regulação por id_regulacao.
    columns:
      - name: id_ciclo
        description: "Chave do ciclo de acolhimento."
        tests: [unique, not_null]
      - name: data_solicitacao
        description: "Data da solicitação de vaga correspondente ao atendimento do ciclo."
      - name: data_regulacao
        description: "Data da primeira notificação da regulação; fallback para a data de regulação."
