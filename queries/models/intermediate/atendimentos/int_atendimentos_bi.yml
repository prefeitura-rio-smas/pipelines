version: 2
models:
  - name: int_atendimentos_bi
    description: Linhas de atendimento/profissional selecionadas com os filtros, partições e desempates estáveis da programada; única entrada dos structs de atendimento. E-mails recalculados com CAS e e-mail da unidade do prontuário e filtro_email_dev por nome de unidade, sem multiplicar linhas.
    data_tests:
      - pu_selecao_bi_paridade:
          config:
            enabled: true
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [seq_atendimento, modulo, id_usuario, profissional_id]
    columns:
      - name: email
        description: "Concatenação de email_cas, vírgula, e-mails da planilha, vírgula e espaço, email_unidade. Partes nulas viram vazio. A planilha é consolidada por unidade normalizada, com e-mails distintos em ordem alfabética."
      - name: id_usuario
        data_tests: [not_null]
