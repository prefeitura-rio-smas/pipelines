version: 2
models:
  - name: int_atendimentos_bi
    description: Linhas de atendimento/profissional selecionadas com os filtros, partições e desempates estáveis da programada; única entrada dos structs de atendimento.
    data_tests:
      - pu_selecao_bi_paridade:
          config:
            enabled: "{{ var('pu_validar_programada', false) }}"
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [seq_atendimento, modulo, id_usuario, profissional_id]
    columns:
      - name: id_usuario
        data_tests: [not_null]
