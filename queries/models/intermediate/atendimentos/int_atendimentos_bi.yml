version: 2
models:
  - name: int_atendimentos_bi
    description: Linhas de atendimento/profissional selecionadas com os filtros, partições e desempates estáveis da programada; única entrada dos structs de atendimento. E-mails recalculados com CAS e e-mail da unidade do prontuário e filtro_email_dev por nome de unidade, sem multiplicar linhas.
    data_tests:
      - pu_selecao_bi_paridade:
          config:
            enabled: true
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [seq_atendimento, modulo, id_usuario, profissional_id]
    columns:
      - name: email
        description: "Formato da programada: email_cas, email_unidade, email_planilha, separados por vírgula. Preserva o texto original da planilha, incluindo espaços, quebras de linha e repetições. CAS fora de 01 a 10 usa gdados.smas@prefeitura.rio; partes nulas viram vazio. Linhas idênticas da planilha são consolidadas; valores conflitantes interrompem a execução."
      - name: id_usuario
        data_tests: [not_null]
