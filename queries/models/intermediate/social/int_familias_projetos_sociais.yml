version: 2
models:
  - name: int_familias_projetos_sociais
    description: Preserva o ARRAY legado; acrescenta descrições dos projetos ativos e histórico com unidade, login
      e datas.
    columns:
      - name: id_familia
        description: ID original da família.
      - name: projetos_sociais
        description: Array legado preservado para dimensões e consumidores existentes.
      - name: projetos_sociais_descricao
        description: Nomes dos projetos ativos e sem cancelamento no cadastro disponível.
      - name: projetos_sociais_historico
        description: ARRAY de projetos com nome, unidade, login, datas e indicador ativo, sem reconstruir versões
          cadastrais antigas.
