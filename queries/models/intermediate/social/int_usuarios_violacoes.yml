version: 2

models:
  - name: int_usuarios_violacoes
    description: |
      Violações de direitos dos usuários, unificadas a partir do atributo do cadastro
      (raw_usuarios_detalhes.violacao_direito) e de campos de formulário em evoluções.
      Granularidade: 1 linha por id_usuario. Ephemeral — materializado como CTE
      nos modelos que o referenciam (dim_usuarios e int_perfil_social_usuarios,
      usado pela mart_atendimentos); o BI acessa os itens via UNNEST.
    columns:
      - name: id_usuario
        description: "ID original do usuário (seqpac)."
        tests:
          - not_null
          - unique
      - name: violacoes
        description: >
          Array estruturado de violações do usuário, STRUCT (codigo, descricao, origem).
          Origem com 3 estados: 'cadastro' (só no cadastro), 'evolucao' (só na evolução),
          'ambas' (presente nas duas origens). 1 item por (id_usuario, codigo) — sem
          duplicatas de código (multiplicidade de evoluções/campos/cadastro sujo colapsada).
