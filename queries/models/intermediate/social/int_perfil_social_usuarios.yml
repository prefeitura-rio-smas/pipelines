version: 2
models:
  - name: int_perfil_social_usuarios
    description: Perfil cadastral atual por usuário, incluindo TESTE e IDs sem cadastro principal; ausência não implica negativa.
    columns:
      - name: id_usuario
        data_tests: [unique, not_null]
  - name: int_servicos_familia_completos
    description: Serviços por família; resumo de não cancelados e histórico completo, incluindo códigos sem nome validado.
    columns:
      - name: id_familia
        data_tests: [unique, not_null]
