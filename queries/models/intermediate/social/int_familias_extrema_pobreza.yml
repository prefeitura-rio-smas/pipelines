version: 2

models:
  - name: int_familias_extrema_pobreza
    description: "Linkage Prontuário x CadÚnico por CPF para o item B.1 do RMA (renda per capita mínima entre as famílias CadÚnico vinculadas; corte aplicado no mart via var corte_extrema_pobreza). Agnóstico a serviço — reutilizável pelo CREAS. Grão: 1 linha por família do Prontuário com renda localizada."
    columns:
      - name: id_familia
        description: "ID da família no Prontuário."
      - name: renda_media_pc
        description: "Menor renda média per capita (identificacao_controle.valor_renda_media) entre as famílias CadÚnico vinculadas aos CPFs dos membros."
