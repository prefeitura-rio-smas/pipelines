version: 2

models:
  - name: int_familias_extrema_pobreza
    description: "Linkage Prontuário x CadÚnico por CPF normalizado para o item B.1 do RMA. Retorna a renda per capita mínima CadÚnico entre os vínculos encontrados e a renda per capita declarada no próprio Prontuário. O corte é aplicado no mart via var corte_extrema_pobreza. Agnóstico a serviço — reutilizável pelo CREAS. Grão: 1 linha por família do Prontuário com ao menos um membro ativo."
    columns:
      - name: id_familia
        description: "ID da família no Prontuário."
        tests:
          - not_null
          - unique
      - name: qtd_membros_ativos
        description: "Quantidade de membros ativos da família no Prontuário (membros_familia.data_saida null)."
        tests:
          - not_null
      - name: qtd_membros_informaram
        description: "Quantidade de membros ativos com renda informada (renda_ativa ou renda_beneficio de benefício de renda permanente)."
      - name: renda_media_pc
        description: "Menor renda média per capita (identificacao_controle.valor_renda_media) entre as famílias CadÚnico cadastradas e válidas vinculadas aos CPFs dos membros. NULL quando a família não possui vínculo CadÚnico com renda registrada."
      - name: renda_familiar_prontuario
        description: "Soma das rendas declaradas no Prontuário pelos membros ativos (renda_ativa + renda_beneficio de Aposentadoria, BPC, Pensão por morte ou Aposentadoria por invalidez — códigos 1, 9, 20 e 32). Membros sem renda informada são ignorados; NULL quando nenhum membro informou renda."
      - name: renda_media_pc_prontuario
        description: "Renda per capita declarada no Prontuário (renda_familiar_prontuario / qtd_membros_ativos). NULL quando nenhum membro informou renda."
