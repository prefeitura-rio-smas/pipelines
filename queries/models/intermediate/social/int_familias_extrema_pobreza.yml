version: 2

models:
  - name: int_familias_extrema_pobreza
    description: "Linkage Prontuário x CadÚnico por CPF normalizado para o item B.1 do RMA. Considera somente famílias CadÚnico cadastradas e válidas; retorna a renda per capita mínima entre os vínculos encontrados. O corte é aplicado no mart via var corte_extrema_pobreza. Agnóstico a serviço — reutilizável pelo CREAS. Grão: 1 linha por família do Prontuário com renda localizada."
    columns:
      - name: id_familia
        description: "ID da família no Prontuário."
        tests:
          - not_null
          - unique
      - name: renda_media_pc
        description: "Menor renda média per capita (identificacao_controle.valor_renda_media) entre as famílias CadÚnico cadastradas e válidas vinculadas aos CPFs dos membros."
        tests:
          - not_null
