version: 2

models:
  - name: fct_presencas_usuarios
    description: |
      Fato de presenças de usuários em atividades de grupo.
      Grão: 1 linha por presença de um usuário em uma atividade em uma data/hora.
    config:
      materialized: table
    columns:
      - name: id_presenca
        description: "Surrogate key da presença (hash de id_atividade + id_usuario + data_presenca + hora_presenca)."
        data_type: string
        tests:
          - not_null
          - unique

      - name: id_atividade
        description: "Identificador da atividade (FK para dim_atividades_grupo)."
        data_type: integer
        tests:
          - not_null

      - name: id_usuario
        description: "Identificador do usuário/paciente (FK para dim_usuarios)."
        data_type: integer
        tests:
          - not_null

      - name: data_presenca
        description: "Data da presença."
        data_type: date
        tests:
          - not_null

      - name: hora_presenca
        description: "Hora da presença."
        data_type: string

      - name: id_unidade
        description: "Identificador da unidade onde a presença foi registrada."
        data_type: integer

      - name: id_setor
        description: "Identificador do setor onde a presença foi registrada."
        data_type: integer
