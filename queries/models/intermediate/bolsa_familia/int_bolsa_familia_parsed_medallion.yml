version: 2

models:
  - name: int_bolsa_familia_parsed_medallion
    description: |
      Camada Silver que transforma a linha bruta da folha do Bolsa Família
      em colunas estruturadas. Suporta os layouts de 34 e 35 colunas.
    columns:
      - name: qtd_colunas_brutas
        description: "Quantidade de colunas detectadas no layout bruto."
        data_tests:
          - accepted_values:
              arguments:
                values: [34, 35]
                quote: false
      - name: COD_FAMILIAR
        description: "Código de identificação familiar."
        tests:
          - not_null
      - name: REF_FOLHA
        description: "Mês de referência da folha."
        tests:
          - not_null:
              name: not_null_ref_folha_todas_as_linhas
          - not_null:
              name: not_null_ref_folha_rf
              config:
                where: "MARCA_RF = 'S'"
                severity: warn
      - name: COMPET_PARCELA
        description: "Mês de competência da parcela."
        tests:
          - not_null:
              config:
                where: "MARCA_RF = 'S'"
                severity: warn
      - name: INICIO_VIG_BENEF
        description: |
          Início da vigência do benefício (AAAA-MM, dia 1). A fonte traz
          AAAAMM; o parsing usa `%Y%m`. Preenchido nas linhas de membros
          (MARCA_RF = 'N'); as linhas do responsável familiar vêm em branco.
        tests:
          - not_null:
              name: not_null_inicio_vig_membros
              config:
                where: "MARCA_RF = 'N'"
                severity: warn
      - name: FIM_VIG_BENEF
        description: |
          Fim da vigência do benefício (AAAA-MM, dia 1), quando informado.
          Pode ser nulo para benefícios sem data de encerramento.
      - name: DT_ATU_CADASTRAL
        description: |
          Data de atualização cadastral (DD/MM/AAAA). Preenchida apenas nas
          linhas do responsável familiar (MARCA_RF = 'S').
        tests:
          - not_null:
              name: not_null_dt_atu_rf
              config:
                where: "MARCA_RF = 'S'"
                severity: warn
