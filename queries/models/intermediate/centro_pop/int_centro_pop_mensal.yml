version: 2
models:
- name: int_centro_pop_mensal
  description: Prévia de uma competência Centro POP por cidadão/unidade. Sem reconstrução
    de cadastro histórico; perfil observado na captura, limitado às ocorrências até
    a competência. Sem dados repetidos.
  columns:
  - name: mes_referencia
    description: Primeiro dia da competência, DATE. Data de realização rege atendimentos;
      data de evolução rege evoluções; presença rege atividades.
  - name: data_carga_fontes
    description: Menor watermark entre as últimas extrações de atendimentos, evoluções
      e presenças. Permite identificar defasagem das fontes no momento da captura.
  - name: data_atualizacao
    description: Instante da captura usada na prévia e preservado no fechamento.
