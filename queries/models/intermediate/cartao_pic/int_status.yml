version: 2

sources:
  - name: cartao_pic
    description: "Dataset do Cartão PIC (prod)."
    database: rj-smas
    schema: cartao_pic
    tables:
      - name: beneficiarios
        description: "Folha nova de beneficiários (30.000) gerada pela pipeline de elegibilidade."
      - name: analise_elegibilidade_cadunico
        description: "Análise completa de elegibilidade (1.118.156 famílias)."
      - name: status
        description: "Base oficial empilhada da status (bootstrap da int_status: partições históricas)."

models:
  - name: int_status
    description: >
      Base empilhada da status do Cartão PIC (atributos estáticos por folha).
      Incremental por data_particao: cada execução processa a folha corrente
      (cartao_pic.beneficiarios) e preserva as partições históricas. No bootstrap,
      herda as partições anteriores da própria base oficial (cartao_pic.status).
      Colunas novas das partições antigas = NULL.
      Acao_smas, alerta, cohort, ativo/inativo, filtro_email_cas, flags.
    tags: [cartao_pic_status]
