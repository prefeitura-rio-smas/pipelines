version: 2

sources:
  - name: cartao_pic
    description: "Dataset do Cartão PIC (prod)."
    database: rj-smas
    schema: cartao_pic
    tables:
      - name: beneficiarios
        description: "Folha nova de beneficiários (30.000) gerada pela pipeline de elegibilidade."
      - name: analise_elegibilidade_cadunico
        description: "Análise completa de elegibilidade (1.118.156 famílias)."
      - name: status
        description: "Base oficial empilhada da status (bootstrap da int_status: partições históricas)."

models:
  - name: int_status
    description: >
      Base empilhada do Cartão PIC: folha corrente (cartao_pic.beneficiarios)
      enriquecida com Controle CAS (CRAS/doc), Survey de entregas (dedup de
      negócio: primeira entrega registrada no ArcGIS) e Eventos (capacidade
      acumulada por bairro, recorte alerta IN retirar_*).
      Incremental por data_particao: preserva as partições históricas; no
      bootstrap herda as anteriores da própria base oficial (cartao_pic.status).
      A mart_status aplica apenas a apresentação final (cases).
    tags: [cartao_pic_status]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - data_particao
            - cod_familiar_fam
          name: unique_int_status_data_particao_familia
