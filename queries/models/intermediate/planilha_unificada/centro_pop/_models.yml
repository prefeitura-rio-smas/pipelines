version: 2
models:
- name: int_pu_registros_centro_pop
  description: Uma ocorrência datada de resposta ou presença; preserva as regras de
    extração já validadas, sem consolidar por usuário ou mês. Dados gerais de pessoa
    não geram vínculo artificial com unidades.
  data_tests:
  - pu_cpop_integridade
  columns:
  - name: id_usuario
    data_tests:
    - not_null
  - name: id_registro
    description: Identidade técnica estável da ocorrência, preservada na separação
      do antigo model.
    data_tests:
    - not_null
    - unique
- name: int_pu_perfil_centro_pop
  data_tests: [pu_cpop_selecao, pu_cpop_unidades]
  description: Perfil por usuário com registro específico ou atendimento Centro POP; sem formulário, respostas permanecem vazias.
  columns:
  - name: id_usuario
    data_tests:
    - not_null
    - unique

- name: int_pu_centro_pop_mensal
  description: Contexto mensal derivado exclusivamente da supertabela; chave usuário/unidade/mês.
  data_tests:
  - pu_mensal_grupos
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns: [id_usuario, id_unidade, mes_referencia]
  columns:
  - name: id_usuario
    data_tests: [not_null]
  - name: id_unidade
    data_tests: [not_null]
  - name: mes_referencia
    data_tests: [not_null]
