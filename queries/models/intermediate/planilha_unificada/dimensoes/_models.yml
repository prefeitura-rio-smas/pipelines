version: 2
models:
  - name: dim_cras
    description: Uma linha por usuário com registros qualitativos de CRAS, sem contagens; construção isolada e publicação controlada.
    data_tests:
      - pu_preservacao_dimensao:
          arguments: {servico: cras}
      - pu_formularios_dimensao:
          arguments: {servico: cras}
    columns:
      - name: id_usuario
        data_tests: [not_null, unique]
  - name: dim_creas
    description: Uma linha por usuário com registros qualitativos de CREAS.
    data_tests:
      - pu_preservacao_dimensao:
          arguments: {servico: creas}
      - pu_formularios_dimensao:
          arguments: {servico: creas}
    columns:
      - name: id_usuario
        data_tests: [not_null, unique]
  - name: dim_centro_pop
    description: Último perfil Centro POP por usuário, considerando todas as unidades e sem corte mensal. Colunas simples e listas de texto; uma ocorrência inteira por assunto, sem preencher lacunas com formulários anteriores. Registro PAI não implica acompanhamento ativo.
    columns:
      - name: id_usuario
        data_tests: [not_null, unique]
    data_tests:
      - pu_cpop_perfil
      - pu_cpop_sem_structs
  - name: int_pu_registros_centro_pop
    description: Uma ocorrência datada de resposta ou presença; preserva as regras de extração já validadas, sem consolidar por usuário ou mês. Dados gerais de pessoa não geram vínculo artificial com unidades.
    data_tests:
      - pu_cpop_integridade
    columns:
      - name: id_usuario
        data_tests: [not_null]
      - name: id_registro
        description: Identidade técnica estável da ocorrência, preservada na separação do antigo model.
        data_tests: [not_null, unique]
  - name: dim_outros_equipamentos
    description: Uma linha por usuário nos demais equipamentos, incluindo unidades desconhecidas.
    data_tests:
      - pu_preservacao_dimensao:
          arguments: {servico: outros}
      - pu_formularios_dimensao:
          arguments: {servico: outros}
    columns:
      - name: id_usuario
        data_tests: [not_null, unique]
