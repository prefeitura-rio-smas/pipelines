version: 2

models:
  - name: mart_pic_prontuario_carioca
    description: |
      Mart Prontuário Carioca para PIC.
      Grão: 1 linha por família identificada como PIC.
      Duas origens de identificação: (1) projeto social PIC via dim_familias.projetos_sociais,
      (2) evolução aba Pequenos Cariocas (codigo_abrangencia=20) via fct_evolucoes.
      Indicadores propagam para toda a família via LOGICAL_OR entre membros ativos.
      Famílias sem crianças 0-6 permanecem com membros = [].
      Busca Ativa: coluna busca_ativa = ARRAY<STRUCT> com TODAS as buscas ativas da
      família (todas as evoluções do formulário '1. Pequenos Cariocas - Busca Ativa',
      codigo_abrangencia=20), em ordem cronológica (data_evolucao, id_evolucao).
      possui_busca deriva de ARRAY_LENGTH(busca_ativa) > 0.
    columns:
      - name: responsavel_familiar
        description: "Struct com CPF e nome do responsável familiar (dado por dim_familias.id_usuario_responsavel -> dim_usuarios)."
      - name: origem_identificacao
        description: "Array de strings identificando por quais origens a familia foi capturada: 'projeto_social' e/ou 'evolucao_aba_20'."
      - name: membros
        description: "Array de structs com nome, idade e CPF das criancas de 0 a 6 anos ativas na familia (data_saida IS NULL). Vazio se nao houver criancas nessa faixa."
      - name: indicador_violacao_direito
        description: "Booleano. True se algum membro ativo da familia possui flag_possui_violacao_direito = 'Sim'. Propagado via LOGICAL_OR."
      - name: violacao_direito
        description: "Array de strings com descricoes distintas de violacoes de direito de todos os membros ativos da familia."
      - name: possui_filiacao_completa
        description: "Booleano. True se algum membro ativo da familia possui filiacao completa na certidao (ultima evolucao codigo_abrangencia=24). Propagado via LOGICAL_OR."
      - name: interesse_filiacao_completa
        description: "Booleano. True se algum membro ativo tem interesse em regularizar filiacao faltante (ultima evolucao codigo_abrangencia=24). Propagado via LOGICAL_OR."
      - name: possui_encaminhamento_documentacao_civil
        description: "Booleano. True se a familia teve ao menos um encaminhamento valido no formulario Documentacao Civil (codigo_abrangencia=24). Filtra o valor 'undefined' que representa checkbox nao marcado."
      - name: encaminhamentos_documentacao_civil
        description: "Array de strings com os encaminhamentos distintos registrados no formulario Documentacao Civil."
      - name: busca_ativa
        description: |
          ARRAY<STRUCT> com TODAS as buscas ativas realizadas pela família (histórico completo,
          não apenas a última). Shape idiomático BigQuery: cada elemento do array é UMA busca
          (1 evolução do formulário '1. Pequenos Cariocas - Busca Ativa', codigo_abrangencia=20),
          em ordem cronológica (data_evolucao, id_evolucao). Não suporta ARRAY<ARRAY>, por isso
          os campos multi-valor são ARRAY<STRING> dentro do struct de cada busca.
          possui_busca (uso: ARRAY_LENGTH(busca_ativa) > 0) não fica como coluna — deriva do array.
          Campos de cada struct:
          - data: date. Data digitada no formulário (safe.parse_date '%d/%m/%Y'). NULL NAQUELA
            busca se a data for inválida (ex.: 06/08/25026) — a evolução é PRESERVADA no array
            com data NULL, não descartada, e as buscas anteriores NÃO são afetadas.
          - tipo: array de strings com os tipos de busca ativa (ex: Domicilio, Por telefone).
          - familia_localizada: booleano. True se a família foi localizada (campo 'Família localizada?' = Sim).
          - motivo_nao_localizada: array de strings com os motivos de não localização (ex: Endereco
            desatualizado, Ligacao nao atendida). Vazio se a família foi localizada.
          - protocolo_violado: array de strings com os protocolos violados identificados naquela busca.
      - name: ultima_atualizacao
        description: "Timestamp da última sincronização do Airbyte (heartbeat da pipeline via raw_configuracoes_sistema)."
        tests:
          - not_null
