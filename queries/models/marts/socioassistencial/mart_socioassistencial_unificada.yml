version: 2
models:
  - name: mart_socioassistencial_unificada
    description: |
      Fonte socioassistencial de consumo em paralelo aos produtos atuais. Um registro
      por evento, participação, formulário, declaração de encaminhamento, vínculo de
      serviço ou família/serviço/unidade/competência. Nenhum filtro analítico global.
      Contexto cadastral atual é identificado como snapshot e não comprova condições
      históricas. Consulte queries/docs/socioassistencial_unificada.md e as matrizes
      de cobertura antes de calcular RMAs. ABORDAGEM ainda não certifica contato
      contabilizável; ENCAMINHAMENTO não identifica cada envio de multisseleções.
      Particionada por competência, inclusive partição NULL para eventos sem data.
    meta:
      estrategia_migracao: paralela_sem_alterar_consumidores
      indicadores_oficiais_certificados: false
    columns:
      - name: id_registro
        description: Hash de tipo, origem e chave da ocorrência; único globalmente.
        data_tests: [not_null, unique]
      - name: tipo_registro
        description: Natureza e unidade de contagem; nunca somar tipos diferentes.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ATENDIMENTO, ACOMPANHAMENTO_MENSAL, VINCULO_SERVICO, ATIVIDADE_COLETIVA, FORMULARIO, ENCAMINHAMENTO, ABORDAGEM]
      - name: origem_registro
        description: Sistema/tabela e módulo quando aplicável; parte da chave global.
        data_tests: [not_null]
      - name: id_registro_origem
        description: Chave com módulo, GlobalID ou hash composto quando a origem não possui PK; ver dicionário.
        data_tests: [not_null]
      - name: id_usuario
        description: ID do prontuário; NULL em abordagens sem identidade conciliada. Nunca associar por nome.
      - name: id_familia
        description: Família original do fato ou associação atual herdada da V2 nos atendimentos de usuário.
      - name: id_unidade
        description: Unidade da origem; NULL se ausente ou se o nome ArcGIS não permitir associação unívoca.
      - name: nome_unidade
        description: Nome atual da unidade no prontuário; nome original ArcGIS permanece em abordagem.
      - name: tipo_unidade
        description: Classificação atual da dimensão; fallback nominal mantém unidades excluídas pela dimensão.
      - name: cas
        description: CAS atual da unidade; fallback informado no ArcGIS.
      - name: data_evento
        description: Data da ocorrência; NULL para estoque mensal. Cadastro do vínculo não é data de atendimento.
      - name: competencia
        description: Primeiro dia do mês do evento ou mês de acompanhamento; NULL quando a origem não oferece data.
      - name: data_referencia
        description: Data do evento, exceto acompanhamento e participação coletiva (fechamento mensal para RMA).
      - name: ultima_atualizacao
        description: Atualização do Prontuário via sys_config; para ABORDAGEM, captura ArcGIS convertida para America/Sao_Paulo.
      - name: instante_materializacao
        description: Instante UTC de construção; não equivale à data de alteração do cadastro.
      - name: idade_na_referencia
        description: Idade completa na referência, a partir do nascimento cadastral atual ou nascimento informado na abordagem. Pode ser recalculada com outra referência.
      - name: usuario
        description: STRUCT cadastral atual, inclusive testes; sexo, gênero, raça/cor, documentos, endereço e identificação.
      - name: perfil_social
        description: STRUCT de benefícios, deficiência, violações, situação de rua, saúde/comorbidades, renda e CadÚnico declarado; snapshot atual.
      - name: familia
        description: STRUCT com responsável, membros e vigências, vulnerabilidades, renda atual, projetos e histórico de serviços; não expandir para contar fatos.
      - name: atendimento
        description: STRUCT preservando módulo, chaves, equipe/CBOs e ranks do PR, flags, cancelamento e dados da ocorrência.
      - name: acompanhamento
        description: STRUCT de serviço, flags de ingresso e estoque, vínculos e competência em curso. Grão família/serviço/unidade/mês.
      - name: vinculo_servico
        description: Registro de serviço observado, inclusive sem datas válidas; hash de conteúdo muda quando a origem é editada. Não é acompanhamento mensal adicional.
      - name: atividade
        description: Participação com chave composta, multiplicidade de cópias, catálogo e classificações existentes do RMA CRAS.
      - name: formulario
        description: Respostas datadas com título, evolução/módulo, cancelamento e abrangência. Evidência de plano/MSE não significa vínculo vigente.
      - name: encaminhamento
        description: Campo de encaminhamento preenchido com categoria e destinos íntegros; resultado desconhecido e evento individualizado falso.
      - name: abordagem
        description: Ocorrência ArcGIS com pessoa/cluster anual, perfil no contato, unidade original e controles da ficha. Contabilização oficial pendente.
      - name: planilha_centro_pop
        description: ARRAY de contextos da planilha legada associados ao evento por ID/usuário/unidade/data. Os campos mensais e cadastrais não são medidas aditivas. Nº é calculado na apresentação.
