version: 2
models:
  - name: centro_pop_mensal
    description: Prévia de uma competência Centro POP por cidadão/unidade. Sem reconstrução de cadastro histórico; perfil observado na captura, limitado às ocorrências até a competência. Sem dados repetidos.
    columns:
      - name: mes_referencia
        description: Primeiro dia da competência, DATE. Data de realização rege atendimentos; data de evolução rege evoluções; presença rege atividades.
      - name: data_carga_fontes
        description: Menor watermark entre as últimas extrações de atendimentos, evoluções e presenças. Permite identificar defasagem das fontes no momento da captura.
      - name: data_atualizacao
        description: Instante da captura usada na prévia e preservado no fechamento.
  - name: centro_pop_snapshots
    description: Fotos imutáveis versionadas, sem expiração, escritas exclusivamente por fechar_centro_pop_mes. Full refresh desabilitado.
  - name: centro_pop_historico
    description: Última versão de cada competência fechada e prévia corrente. Campos de perfil observados na captura; sem reconstrução histórica dos atributos cadastrais.
