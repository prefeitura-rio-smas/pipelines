version: 2
models:
  - name: prontuario_bi_permissoes
    description: Permissões distintas por e-mail e unidade, derivadas de CAS, unidade e planilha. Não autoriza pelo histórico do cidadão.
    columns:
      - name: email
        data_tests: [not_null]
      - name: id_unidade
        data_tests: [not_null]
  - name: prontuario_bi_atendimentos
    description: Uma linha por usuário e atendimento canônico da unidade de origem; conectar ao Studio somente por consulta autenticada.
  - name: prontuario_bi_linhas_profissionais
    description: Linhas da referência programada, sem expandir permissões; contagem independente da quantidade de eventos.
  - name: prontuario_bi_evolucoes
    description: Evoluções não canceladas e respectivos formulários da mesma unidade; registros sem unidade são excluídos.
  - name: prontuario_bi_centro_pop
    description: Perfil Centro POP selecionado por usuário e unidade, com encaminhamentos históricos restritos à unidade.
  - name: prontuario_bi_creas
    description: Último formulário integral por assunto dentro da unidade; sem preenchimento por registros de outra unidade.
  - name: prontuario_bi_perfil_unidade
    description: Uma linha por usuário e unidade, com cadastro escalar e perfis e contadores exclusivos dessa unidade. Contar cidadãos distintos para consolidar várias unidades.
