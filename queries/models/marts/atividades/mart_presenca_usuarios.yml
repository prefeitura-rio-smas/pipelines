version: 2

models:
  - name: mart_presenca_usuarios
    description: |
      Mart de presenças de usuários em atividades de grupo, enriquecido com dados
      cadastrais dos usuários e informações da atividade.
      Grão: 1 linha por presença de usuário em atividade.
    config:
      materialized: table
      schema: relatorio
    columns:
      - name: id_presenca
        description: "Surrogate key da presença."
        data_type: string
        tests:
          - not_null
          - unique

      - name: id_usuario
        description: "Identificador do usuário."
        data_type: integer
        tests:
          - not_null

      - name: nome_usuario
        description: "Nome completo do usuário."
        data_type: string

      - name: data_nascimento
        description: "Data de nascimento do usuário."
        data_type: date

      - name: idade
        description: "Idade calculada do usuário (anos)."
        data_type: integer

      - name: bairro
        description: "Bairro de residência do usuário."
        data_type: string

      - name: id_atividade
        description: "Identificador da atividade."
        data_type: integer
        tests:
          - not_null

      - name: nome_atividade
        description: "Nome da atividade de grupo."
        data_type: string

      - name: nome_tipo_atividade
        description: "Nome do tipo de atividade."
        data_type: string

      - name: nome_unidade
        description: "Nome da unidade responsável pela atividade."
        data_type: string

      - name: data_presenca
        description: "Data da presença."
        data_type: date
        tests:
          - not_null

      - name: hora_presenca
        description: "Hora da presença."
        data_type: string
      - name: flag_desligamento
        description: "Indica se houve evolução de desligamento no Tô de Boa (Sim/Não)."
        data_type: string

      - name: motivo_desligamento
        description: "Motivo do desligamento registrado em evolução Tô de Boa - Desligamento."
        data_type: string

      - name: flag_cancelamento_atividades
        description: "Indica se houve evolução de cancelamento no Tô de Boa (Sim/Não)."
        data_type: string

      - name: motivo_cancelamento
        description: "Motivo do cancelamento registrado em evolução Tô de Boa - Cancelamento das atividades."
        data_type: string

      - name: flag_justificativa_falta
        description: "Indica se houve evolução de justificativa de falta no Tô de Boa (Sim/Não)."
        data_type: string

      - name: justificativa_falta
        description: "Justificativa registrada em evolução Tô de Boa - Justificativa de Falta."
        data_type: string
      - name: ultima_atualizacao
        description: "Timestamp da última sincronização do Airbyte (heartbeat da pipeline via raw_configuracoes_sistema)."
        data_type: timestamp
        tests:
          - not_null
      - name: ano
        description: "Ano da última extração (derivado de ultima_atualizacao)."
        data_type: integer
      - name: mes
        description: "Mês da última extração (derivado de ultima_atualizacao)."
        data_type: integer
