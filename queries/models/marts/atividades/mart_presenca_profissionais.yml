version: 2

models:
  - name: mart_presenca_profissionais
    description: |
      Mart de presenças de profissionais em atividades de grupo, enriquecido com dados
      dos profissionais (CBOs) e informações da atividade.
      Grão: 1 linha por presença de profissional em atividade.
    config:
      materialized: table
      schema: relatorio
    columns:
      - name: id_presenca
        description: "Surrogate key da presença."
        data_type: string
        tests:
          - not_null
          - unique

      - name: id_profissional
        description: "Identificador do profissional."
        data_type: integer
        tests:
          - not_null

      - name: nome_profissional
        description: "Nome completo do profissional."
        data_type: string

      - name: codigo_cbo
        description: "Array de códigos CBO do profissional. ARRAY<STRING> (pass-through da dim_profissionais)."
        data_type: ARRAY<STRING>

      - name: nome_cbo
        description: "Array de descrições CBO do profissional. ARRAY<STRING> (pass-through da dim_profissionais)."
        data_type: ARRAY<STRING>

      - name: id_atividade
        description: "Identificador da atividade."
        data_type: integer
        tests:
          - not_null

      - name: nome_atividade
        description: "Nome da atividade de grupo."
        data_type: string

      - name: nome_tipo_atividade
        description: "Nome do tipo de atividade."
        data_type: string

      - name: nome_unidade
        description: "Nome da unidade responsável pela atividade."
        data_type: string

      - name: data_presenca
        description: "Data da presença."
        data_type: date
        tests:
          - not_null

      - name: hora_presenca
        description: "Hora da presença."
        data_type: string
      - name: ultima_atualizacao
        description: "Timestamp da última sincronização do Airbyte (heartbeat da pipeline via raw_configuracoes_sistema)."
        data_type: timestamp
        tests:
          - not_null
