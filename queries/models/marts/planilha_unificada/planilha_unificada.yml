version: 2

models:
  - name: planilha_unificada
    data_tests: [pu_linhas_bi_preservadas, pu_quantidades_bi, pu_preservacao_eventos, pu_formularios_eventos, pu_familias_atendidas_unicas, pu_familias_atendidas_paridade, pu_familia_no_atendimento_paridade]
    description: |
      Uma linha por usuario.id_usuario, com a mesma população de dim_usuarios.
      Contrato por assunto: usuario, familias, projetos_sociais, atendimentos, evolucoes e escopos.
      Dados pessoais e perfil ficam em usuario; eventos têm quantidade, quantidade por serviço em campos diretos e registros.
      Evoluções não canceladas incluem registros sem formulário, com descrição legível.
      Campos escalares são STRING com ausência como ''; as exceções são usuario.idade,
      INT64 com NULL sem nascimento válido, e as quantidades totais e por serviço, INT64 com zero sem registros.
      STRUCTs ausentes têm campos vazios e listas sem registros são []. Não são
      criados itens para simular ausência. As chaves e os tipos originais permanecem
      nos intermediários; a saída apresenta nomes de unidades associados a cada serviço.
      Base em validação paralela, com atualização explícita em desenvolvimento;
      não substitui a mart Centro POP nem implementa indicadores RMA. Cadastros e
      documentos são o estado atual; cada consumidor define competência e população.
    config:
      meta:
        granularidade: [usuario.id_usuario]
        contrato: por_assunto_v13_paridade_programada
        execucao: modelo_dbt
        publicacao: desenvolvimento
        valores_ausentes: texto_vazio
        structs_ausentes: campos_vazios
        tipos_escalares: STRING
        excecoes_tipos:
          usuario.idade: INT64
          atendimentos.quantidade_linhas_bi: INT64
          atendimentos.quantidade: INT64
          evolucoes.quantidade: INT64
          atendimentos.quantidade_cras: INT64
          atendimentos.quantidade_creas: INT64
          atendimentos.quantidade_centro_pop: INT64
          atendimentos.quantidade_outros: INT64
          evolucoes.quantidade_cras: INT64
          evolucoes.quantidade_creas: INT64
          evolucoes.quantidade_centro_pop: INT64
          evolucoes.quantidade_outros: INT64
        identificadores_permitidos:
          - atendimentos.registros.id_unidade
          - evolucoes.registros.id_unidade
          - escopos.centro_pop.historico.id_unidade
          - escopos.centro_pop.participacoes.id_unidade
          - id_usuario
          - id_familia
          - id_atendimento_modulo
          - id_evolucao_modulo
          - escopos.centro_pop.participacoes.id_atividade
          - atendimentos.registros.profissionais.id_profissional
          - atendimentos.registros.profissionais.id_familia_referencia
          - atendimentos.registros.profissionais.id_atendimento_legado
    columns:
      - name: usuario.naturalidade
        data_type: STRING
        description: Município de nascimento informado em muninasc do AcolheRio; sem inferência pela UF ou endereço. Vazio quando ausente.
      - name: usuario.idade
        data_type: INT64
        description: Idade em anos completos na data de atualização da tabela, no fuso America/Sao_Paulo. NULL para nascimento ausente, inválido ou futuro. Permanece fixa até a próxima atualização.
      - name: atendimentos.quantidade_linhas_bi
        data_type: INT64
        description: Total das linhas de atendimento/profissional aceitas pela programada; soma do tamanho das listas de profissionais. Não equivale ao número de eventos.
      - name: atendimentos.registros.profissionais.classificacao_atendimento
        description: Tipo da linha do BI, com recepção antes das quatro ocupações técnicas da programada.
      - name: atendimentos.registros.profissionais.profissional_cbo
        description: Descrição normalizada do CBO selecionado pelos rankings legados.
      - name: atendimentos.registros.profissionais.nome_atendimento
        description: Nome ajustado da linha profissional, incluindo recepção de CadÚnico em CRAS e CREAS.
      - name: atendimentos.registros.projetos_sociais_familia
        description: Projetos vigentes da família do atendimento, com a mesma lista ordenada e fallback da programada. Não usar projetos cadastrais do usuário para reproduzir esse filtro.
      - name: atendimentos.registros.id_familia
        description: |
          Família da programada para usuário e atendimento com módulo, independente
          do profissional. STRING vazia quando não há família ou evento na referência.
          Mais de uma família conhecida ou e-mails conflitantes bloqueiam a construção.
          Para o indicador: contagem distinta deste campo, excluindo '', com período,
          tipo_servico em cras/creas/centro_pop, unidade diferente de Negado e acesso
          pelo email deste mesmo atendimento. O email do visualizador é obrigatório.
      - name: atendimentos.familias_atendidas
        description: |
          Compatibilidade temporária: migrar o BI para atendimentos.registros.id_familia.
          ARRAY<STRUCT> por usuário, id_atendimento_modulo e id_familia da programada.
          Campos STRING: id_atendimento_modulo, id_familia, data_atendimento,
          nome_unidade, tipo_unidade, email e elegivel_indicador (S/N).
          Famílias nulas são omitidas; repetições por profissional são deduplicadas.
          Preserva múltiplas famílias no evento e eventos da referência mesmo sem
          profissional no fato novo. Não é a lista cadastral/histórica de familias.
          Elegível quando TIPO_UNIDADE é CRAS, CREAS ou CENTRO POP e a unidade
          satisfaz a condição da programada (nome não nulo e diferente de Negado).
          No BI: contar distintamente id_familia deste bloco, filtrar elegivel_indicador=S,
          período por data_atendimento e acesso pelo email deste mesmo bloco.
          O e-mail deve conter o endereço do usuário conectado, seguindo a regra
          legada. Usuário/e-mail ausente não tem acesso. Nenhuma identidade de
          visualizador nem período fixo é gravado na tabela.
      - name: evolucoes.registros.formularios.data_ocorrencia
        description: Data informada válida e única do formulário; usa data_evolucao como alternativa.
      - name: evolucoes.registros.formularios.origem_data_ocorrencia
        description: formulario ou fonte; preserva a procedência da data efetiva.
      - name: evolucoes.registros.formularios.situacao_data_ocorrencia
        description: valida, ausente, invalida, conflitante ou nao_mapeado.
      - name: atendimentos.registros.id_unidade
        description: Chave da unidade do atendimento, como texto, para agrupamento sem associação pelo nome.
      - name: evolucoes.registros.id_unidade
        description: Chave da unidade da evolução, como texto.
      - name: escopos.centro_pop.historico.id_unidade
        description: Chave da unidade do registro; vazio quando a ocorrência é de abrangência pessoa sem unidade.
      - name: escopos.centro_pop.participacoes.id_unidade
        description: Chave da unidade da participação.
      - name: escopos.centro_pop.unidades_atendimento
        description: Lista de nomes das unidades com atendimento Centro POP registrado para o usuário.
        data_type: "ARRAY<STRING>"
      - name: usuario
        description: |
          STRUCT com os atributos cadastrais, documentos e endereço em campos diretos,
          incluindo id_usuario e nome_unidade_referencia; beneficio, deficiencia e
          violacoes continuam em listas. Famílias, projetos e eventos ficam em
          blocos próprios. Documentos são associados pelo CPF e preservam flags de
          ambiguidade como texto; ausência não equivale a uma resposta negativa.
      - name: usuario.id_usuario
        description: Identificador natural do usuário como STRING; mesma população de dim_usuarios.
        data_tests: [not_null, unique]
      - name: familias
        description: |
          ARRAY<STRUCT> por id_familia com responsável e estado cadastral atuais,
          vinculos datados e servicos datados da família. Serviços usam nome_unidade,
          incluem vínculos encerrados e se repetem entre membros; não comprovam
          atendimento individual. Inclui responsáveis sem registro de membro.
          membros é ARRAY<STRUCT<id_usuario STRING, nome STRING, parentesco_responsavel STRING>>,
          com um item por integrante atual (vínculo sem data de saída), inclusive
          o próprio usuário quando atual e o responsável mesmo sem vínculo próprio.
          O responsável recebe parentesco Responsável. A lista é ordenada por nome
          e ID, preserva homônimos e integrantes sem cadastro, com nome vazio.
          A composição atual não altera os vínculos nem as famílias históricas.
      - name: projetos_sociais
        description: |
          ARRAY<STRUCT> com nome_projeto_social, nome_unidade, indicador_ativo e datas.
          Preserva a regra compartilhada: membros familiares ativos e somente o
          cadastro mais recente por usuário/projeto. Não é um histórico completo.
      - name: atendimentos
        description: |
          STRUCT com quantidade INT64, quantidade_cras, quantidade_creas, quantidade_centro_pop, quantidade_outros e registros ARRAY<STRUCT>. Um evento por
          id_atendimento_modulo, com origem, nome_unidade, tipo, data, hora HH:MM,
          flag_cancelado, profissionais e tipo_servico. Preserva somente os eventos e profissionais aceitos pelas regras da programada,
          reproduzidas no dbt com desempates estáveis e sem filtro adicional de cancelamento.
          Profissionais homônimos não são deduplicados após retirar seus IDs.
      - name: atendimentos.quantidade
        description: Igual ao tamanho de atendimentos.registros, em todo o histórico disponível; zero sem eventos.
        data_tests: [not_null]
      - name: atendimentos.registros.tipo_servico
        description: Serviço de origem do evento (cras, creas, centro_pop ou outros), preservado do intermediário comum para futuras marts.
      - name: atendimentos.registros.classificacao_atendimento
        description: Classificação comum aos profissionais selecionados, ou Misto quando divergem. Para métricas por tipo, usar profissionais.classificacao_atendimento; recepção tem precedência conforme a programada. Aplica-se a todos os serviços.
      - name: evolucoes
        description: |
          STRUCT com quantidade INT64 e registros ARRAY<STRUCT>, uma entrada por
          usuário e id_evolucao_modulo não cancelado. Contém origem, família,
          nome_unidade, datas, tipo, profissional, atividade, descricao_evolucao
          legível e formularios ARRAY<STRUCT<titulo_formulario STRING, observacoes STRING, campos ARRAY<STRING>>>.
          Observações são texto legível: tags removidas antes da decodificação de uma camada de entidades HTML.
          Formulários pertencem à evolução, mantêm os textos já normalizados e cada resposta como rótulo: valor, com ordem e repetições preservadas
          e não multiplicam sua quantidade. Sem HTML extraível, formularios é [].
          Evoluções familiares pertencem apenas ao paciente explicitamente indicado.
          Cada registro inclui tipo_servico, preservado do intermediário comum de origem.
      - name: evolucoes.registros.tipo_servico
        description: Serviço de origem da evolução (cras, creas, centro_pop ou outros); não inferir pelo perfil do usuário.
      - name: evolucoes.quantidade
        description: Igual ao tamanho de evolucoes.registros, incluindo evoluções sem formulário; zero sem registros.
        data_tests: [not_null]
      - name: escopos
        description: |
          STRUCT com centro_pop.historico, centro_pop.participacoes e os campos do perfil e a lista de unidades atendidas diretamente em centro_pop, sem
          contagem mensal. Histórico com campos nomeados de PAI, atendimento social,
          saúde, situação de rua e desligamento; preserva origem, abrangência, datas
          de registro/resposta e datas declaradas. Participações comprovadas mantêm
          id_atividade STRING, nome, unidade, data e hora. Cadastro não é replicado;
          campos sem coleta ficam vazios, sem criar ocorrências fictícias.

      - name: atendimentos.quantidade_cras
        description: Contagem INT64 de registros do serviço cras; zero sem registros.
      - name: atendimentos.quantidade_creas
        description: Contagem INT64 de registros do serviço creas; zero sem registros.
      - name: atendimentos.quantidade_centro_pop
        description: Contagem INT64 de registros do serviço centro_pop; zero sem registros.
      - name: atendimentos.quantidade_outros
        description: Contagem INT64 de registros do serviço outros; zero sem registros.
      - name: evolucoes.quantidade_cras
        description: Contagem INT64 de registros do serviço cras; zero sem registros.
      - name: evolucoes.quantidade_creas
        description: Contagem INT64 de registros do serviço creas; zero sem registros.
      - name: evolucoes.quantidade_centro_pop
        description: Contagem INT64 de registros do serviço centro_pop; zero sem registros.
      - name: evolucoes.quantidade_outros
        description: Contagem INT64 de registros do serviço outros; zero sem registros.
      - name: usuario.logradouro
        description: Campo do endereço inteiro da referência do BI; cadastro para usuários fora da referência, sem preencher lacunas da foto.
      - name: usuario.numero
        description: Campo do endereço inteiro da referência do BI; cadastro para usuários fora da referência, sem preencher lacunas da foto.
      - name: usuario.complemento
        description: Campo do endereço inteiro da referência do BI; cadastro para usuários fora da referência, sem preencher lacunas da foto.
      - name: usuario.referencia_ou_comunidade
        description: Campo do endereço inteiro da referência do BI; cadastro para usuários fora da referência, sem preencher lacunas da foto.
      - name: evolucoes.registros.formularios.campos
        description: ARRAY<STRING> com cada resposta no formato rótulo seguido de dois pontos, espaço e valor. Preserva ordem, repetições e respostas vazias; lista vazia sem campos. Os pares originais permanecem no intermediário de formulários.
      - name: atendimentos.registros.cas
        description: CAS da unidade do evento na referência do BI; não associar pelo nome da unidade.
      - name: atendimentos.registros.email_unidade
        description: E-mail da unidade da linha antiga, preservado da referência do BI.
      - name: atendimentos.registros.email_cas
        description: E-mail da CAS da linha antiga, preservado da referência do BI.
      - name: atendimentos.registros.email
        description: Composição original de e-mails do BI; não recalcular com email_filtro da dimensão de unidades.
      - name: atendimentos.registros.cadastrante
        description: Nome apresentado na referência para a pessoa que cadastrou o atendimento; não equivale ao profissional executor.
      - name: atendimentos.registros.data_cadastro_atendimento
        description: Data de cadastro declarada na referência, como STRING, sem fallback pela data de realização.
      - name: atendimentos.registros.profissionais.id_profissional
        description: ID natural do profissional apresentado na linha do atendimento, como STRING; homônimos são preservados.
      - name: atendimentos.registros.profissionais.id_familia_referencia
        description: Família da linha profissional na referência do BI. Pode variar entre profissionais do mesmo evento; não inferir pela lista cadastral de famílias do usuário.
      - name: atendimentos.registros.profissionais.id_atendimento_legado
        description: Valor original de ID_ATENDIMENTO da referência, referente à linha atendimento/profissional e sem módulo. Não substitui a chave canônica id_atendimento_modulo nem deve ser usado como identidade global do evento.

      - name: escopos.centro_pop.possui_registro_pai
        data_type: "STRING"
        description: "Evidência de registro de PAI: Sim ou vazio. Não indica acompanhamento ativo."

      - name: escopos.centro_pop.data_registro_pai
        data_type: "STRING"
        description: "Data de registro do último formulário inteiro de pai; vazia sem evidência."

      - name: escopos.centro_pop.data_resposta_pai
