version: 2

models:
  - name: mart_rma_cras__indicadores
    description: |
      Indicadores do mês de referência do RMA CRAS por unidade CRAS, na nova arquitetura
      (var competencia 'AAAA-MM'; vazio = mês corrente).
      Granularidade: 1 linha por unidade CRAS (dim_unidades, tipo_unidade = 'CRAS').
      Bloco I — famílias em acompanhamento PAIF (A1, A2, B1, B2, B3, B4, B5, B6),
      Bloco II — atendimentos individualizados e encaminhamentos (C1, C2_C3, C4, C5, C6)
      e Bloco D — convivência e atividades coletivas (D.1-D.7), seguindo os itens do
      formulário oficial compartilhado (versão de 2014, encerrada em D.7).

      A1 representa o estoque no último dia da competência; A2 e B1-B6 consideram
      famílias inseridas no PAIF durante o mês. Vínculos de família, membros,
      vulnerabilidades e acolhimentos são avaliados na data de referência quando a
      origem disponibiliza início e fim. Benefícios e violações vêm do estado disponível
      em dim_usuarios, pois a fonte não expõe histórico desses atributos.

      C2 e C3 permanecem agregados porque a origem possui um único checkbox,
      'Cadastro/Atualização Cadúnico', sem informação que permita separar inclusão de
      atualização. C2-C5 excluem evoluções canceladas e usam evoluções administrativas
      tipo 'F' da ficha CRAS e evoluções de família atribuídas aos membros vigentes na
      data da evolução. C6 conta visitas distintas por id_atendimento_modulo.

      D.1 exige família acompanhada pelo PAIF e presença em grupo recorrente identificado
      como PAIF/grupo de famílias. D.2-D.6 usam a unidade da presença (ou a unidade da
      atividade como fallback), sem restringir participantes ao PAIF. Tipos 1-4 são
      tratados como SCFV e tipos 5-8 (Tô de Boa) como atividades não continuadas. D.7
      reúne pessoas com deficiência no SCFV ou nos grupos regulares do PAIF.

      Assunções / paridade (deliberadas):
      - O mapeamento `id_vulnerabilidade = 1` = "Descumprimento de condicionalidades"
        (B3) vem da série legada (`seqvulnerab = 1`) e ainda NÃO está confirmado por
        catálogo no repo — validar com o domínio (SMAS).
      - Idades são avaliadas no fim do mês de competência
        (`calc_idade(..., fim_mes_referencia())`),
        ao contrário do legado (current_date na execução do job) — muda paridade em B5/D.6.
      - Unidade das famílias PAIF atribuída em 3 níveis (serviço → operador → atendimento);
        legado usava apenas o operador. Pode deslocar A1/A2 e séries B vs. histórico.
      - C1 inclui atendimentos domiciliares porque contabiliza todos os atendimentos
        individualizados exceto recepção. Assim, uma mesma visita pode compor C1 e C6,
        conforme os itens independentes do formulário.
      - Os itens B1-B6 restringem deliberadamente o universo às famílias NOVAS do
        mês (paif_novas: data_cadastro_paif no mês de referência), em linha com a
        série legada. Perfis de famílias que entraram em meses anteriores não são
        reavaliados nos itens B.
    columns:
      - name: id_unidade_sk
        description: "Surrogate key da unidade CRAS."
        tests:
          - not_null
          - unique
      - name: id_unidade
        description: "ID da unidade CRAS."
        tests:
          - not_null
      - name: nome_unidade
        description: "Nome da unidade CRAS."
      - name: total_famil_paif_sistema_a1
        description: "A1 — total de famílias em acompanhamento PAIF no sistema."
      - name: total_famil_paif_mes_atual_a2
        description: "A2 — novas famílias inseridas no PAIF no mês de referência."
      - name: total_famil_paif_extrema_pobreza_b1
        description: "B1 — famílias PAIF do mês com renda per capita CadÚnico <= corte (var corte_extrema_pobreza)."
      - name: total_famil_paif_extrema_pobreza_prontuario_b1
        description: "B1 — famílias PAIF do mês com renda per capita declarada no Prontuário <= corte (var corte_extrema_pobreza). Renda do membro = renda_ativa + renda_beneficio de Aposentadoria, BPC, Pensão por morte ou Aposentadoria por invalidez; NULL quando nenhum membro informou renda."
      - name: total_famil_paif_bf_b2
        description: "B2 — famílias PAIF do mês com membro beneficiário Bolsa Família (fonte: módulo Saúde Mental; cobertura parcial, maioria dos membros sem registro)."
      - name: total_famil_paif_descumprimento_b3
        description: |
          B3 — famílias PAIF do mês beneficiárias do Bolsa Família com vulnerabilidade
          "descumprimento de condicionalidades" (id_vulnerabilidade = 1 AND benefício Bolsa Família).
          Assunção herdada da série legada (seqvulnerab = 1); mapeamento ainda não confirmado
          por catálogo no repo — validar com SMAS.
      - name: total_famil_paif_bpc_b4
        description: "B4 — famílias PAIF do mês com membro beneficiário BPC (fonte: módulo Saúde Mental; cobertura parcial)."
      - name: trab_infantil_crianca_adolescente_b5
        description: "B5 — famílias PAIF do mês com membro < 18 anos em situação de trabalho infantil."
      - name: total_famil_paif_acolhimento_b6
        description: "B6 — famílias PAIF do mês com criança/adolescente em ciclo de acolhimento aberto."
      - name: total_atendimentos_c1
        description: "C1 — atendimentos individualizados (exceto recepção, não cancelados) no mês."
      - name: encaminhamento_cadunico_c2_c3
        description: "C2/C3 — famílias com encaminhamento de Cadastro/Atualização CadÚnico no mês. A origem não distingue inclusão de atualização, portanto os dois itens são entregues agregados."
      - name: encaminhamento_bpc_c4
        description: "C4 — indivíduos com encaminhamento BPC - Idoso ou BPC - PCD no mês (grão indivíduo, como na definição oficial; idem C2/C3)."
      - name: encaminhamento_creas_c5
        description: "C5 — famílias com encaminhamento para CREAS no mês (grão família, como na definição oficial; idem C2/C3)."
      - name: total_atendimentos_domiciliar_c6
        description: "C6 — visitas/atendimentos domiciliares distintos por id_atendimento_modulo no mês."
      - name: total_familias_grupos_paif_d1
        description: "D.1 — famílias em acompanhamento PAIF com membro presente em grupo recorrente identificado como PAIF/grupo de famílias no mês."
      - name: total_criancas_0_6_d2
        description: "D.2 — crianças de 0 a 6 anos presentes no SCFV (tipos 1-4) no mês."
      - name: total_criancas_7_14_scfv_d3
        description: "D.3 — crianças/adolescentes 7-14 anos em SCFV (tipos 1-2) no mês."
      - name: total_adolescentes_15_17_scfv_d4
        description: "D.4 — adolescentes 15-17 anos em SCFV (tipo 3) no mês."
      - name: total_idosos_scfv_d5
        description: "D.5 — idosos (60+) em SCFV idosos (tipo 4) no mês."
      - name: total_participantes_nao_continuado_d6
        description: "D.6 — pessoas em atividades não continuadas (tipos Tô de Boa 5-8) no mês."
      - name: total_pcd_coletivos_d7
        description: "D.7 — pessoas com deficiência presentes no SCFV ou em grupos regulares do PAIF no mês."
      - name: ultima_atualizacao
        description: "Data da última atualização dos dados de origem."
        tests:
          - not_null
