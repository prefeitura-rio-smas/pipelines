version: 2

models:
  - name: mart_planilha_unificada_centro_pop
    description: |
      Planilha Unificada Centro POP — 1 linha por id_atendimento não cancelado
      realizado em unidade Centro POP. Usuário, unidade e mês de referência são
      atributos do atendimento. Contagens de atendimentos e oficinas continuam
      mensais e são repetidas em cada linha daquele mês.

      Semântica temporal e limitações:
      - O profissional é uma lista dos profissionais ligados ao atendimento, não uma
        referência mensal. Profissionais compartilhados são agregados em uma linha.
      - Formulários PAI, Atendimento Social, Desligamento PAI, Acolhimento, Documentação
        Civil, Situação de Saúde e respostas do questionário são selecionados até a data
        do atendimento. Registros posteriores não são associados retroativamente.
      - Contagens de atendimento, último dia de atendimento e oficinas são contextos do
        mês e se repetem nas linhas do mesmo usuário/unidade/mês.
      - Campos cadastrais e documentos representam o snapshot atual das fontes, não um
        histórico cadastral reconstituído na data do atendimento.
      - Cadastro Único: data de atualização usa CPF → documento_pessoa.id_familia →
        identificacao_controle.id_familia. A família do prontuário não é a família
        CadÚnico; CPFs com vínculo ambíguo ficam sem data. A ausência de documento não
        é convertida em 'Não' quando a fonte não informa explicitamente essa ausência.
      - 'Documentação Civil' indica formulário registrado e extraível; não comprova
        posse de documento nem necessariamente uma demanda.
      - Campos sem fonte permanecem NULL: território de referência, reinserção familiar,
        empregabilidade imediata, capacidade/habilidades, interesse em curso,
        resultado/acesso, resultado/descrição e observações.
    columns:
      - name: id_usuario
        description: Identificador do usuário no prontuário (id_paciente).
      - name: id_familia
        description: ID da família (Cadastro de Famílias, via usuário responsável). NULL se o usuário não é responsável de família registrada.
      - name: id_unidade
        description: Identificador da unidade Centro POP.
      - name: nome_centro_pop
        description: Nome da unidade Centro POP.
      - name: mes_referencia
        description: Mês de referência (primeiro dia do mês do atendimento).
      - name: id_atendimento
        description: Identificador do atendimento na fato; grão e chave única da mart.
        data_tests: [not_null, unique]
      - name: data_atendimento
        description: Data daquele atendimento, convertida para DATE.
      - name: nome_atendimento
        description: Descrição do tipo de atendimento realizado na linha.
      - name: tipo_atendimento
        description: Classificação daquele atendimento (Técnico, Recepção ou Outros).
      - name: profissionais_atendimento
        description: Nomes dos profissionais associados ao atendimento, sem duplicatas e separados por vírgula.
      - name: nome_usuario
        description: Nome do usuário do serviço (cadastro).
      - name: nome_social
        description: Nome social do usuário (cadastro).
      - name: flag_atendido_pontualmente
        description: Sim/Não — não havia inclusão PAI conhecida até a data daquele atendimento.
      - name: flag_inserido_acompanhamento
        description: Sim/Não — havia inclusão PAI conhecida até a data daquele atendimento.
      - name: data_inclusao_acompanhamento
        description: |
          Primeira data de inclusão PAI conhecida até a data do atendimento da linha.
          Usa o campo 'Data do atendimento:' do formulário; fallback para a data da
          evolução. Ambos os ramos são convertidos para DATE.
      - name: flag_possui_plano_individual
        description: Sim/Não — havia inclusão PAI conhecida até a data daquele atendimento.
      - name: data_ultimo_atendimento_mes
        description: Data do último atendimento daquele usuário/unidade no mês; contexto mensal repetido nas linhas do mês.
      - name: qtd_atendimentos_total
        description: Quantidade de atendimentos do usuário/unidade no mês; contexto mensal repetido em cada linha do mês.
      - name: qtd_atendimentos_tecnico
        description: Quantidade mensal de atendimentos realizados por profissional de nível superior (grupo CBO 2); repetida em cada linha do mês.
      - name: qtd_atendimentos_recepcao
        description: Quantidade mensal de atendimentos de recepção; repetida em cada linha do mês.
      - name: qtd_atendimentos_outros
        description: Quantidade mensal de outros atendimentos; repetida em cada linha do mês.
      - name: motivo_principal_permanencia_rua
        description: Motivo principal de permanência na rua — questionário estruturado 'Situação do Usuário' (HIST_PAC, id_template=3/id_questao=18, campo inativo/sem dados hoje) com fallback no formulário Acolhimento.
      - name: motivo_secundario_permanencia_rua
        description: Motivo secundário de permanência na rua (campo Outros do formulário Acolhimento).
      - name: data_nascimento
        description: Data de nascimento (cadastro).
      - name: idade
        description: Idade na data do atendimento da linha.
      - name: filiacao_mae
        description: Nome da mãe (cadastro).
      - name: flag_registro_formulario_documentacao_civil
        description: |
          Sim/Não Informado — foi extraído um registro do formulário 'Documentação Civil'
          até a data do atendimento. Indica formulário registrado, não posse de documento
          nem necessariamente uma demanda.
      - name: flag_possui_cpf
        description: Sim/Não Informado — Sim quando o CPF está informado no cadastro do usuário; a fonte não fornece um indicador confiável de ausência.
        data_tests:
          - accepted_values:
              values: ['Sim', 'Não Informado']
      - name: numero_cpf
        description: CPF informado no cadastro do prontuário; não é inferido de outro documento.
      - name: flag_possui_rg
        description: Sim/Não Informado — Sim quando há um único número de RG no registro CadÚnico associado pelo CPF; ausência de vínculo, conflito ou ausência do número ficam Não Informado.
        data_tests:
          - accepted_values:
              values: ['Sim', 'Não Informado']
      - name: numero_rg
        description: Número de RG de raw_documento_pessoa, sem zeros à esquerda; somente quando o CPF mapeia um único número após a normalização.
      - name: flag_possui_certidao_nascimento
        description: Sim/Não Informado — Sim quando raw_documento_pessoa registra tipo de certidão 1 (nascimento); ausência de vínculo ou de evidência não presume ausência do documento.
        data_tests:
          - accepted_values:
              values: ['Sim', 'Não Informado']
      - name: numero_certidao_nascimento
        description: Campo id_termi_matricula_certidao para certidão tipo 1, somente quando há um único número registrado.
      - name: genero
        description: Gênero informado no cadastro.
      - name: orientacao_sexual
        description: Orientação sexual informada no cadastro.
      - name: raca_cor
        description: Cor e etnia informada no cadastro.
      - name: naturalidade
        description: UF de nascimento (cadastro).
      - name: flag_estuda
        description: Sim/Não/Não Informado — estuda (cadastro).
      - name: ano_cursando
        description: Ano cursando (cadastro).
      - name: nivel_escolaridade
        description: Nível de escolaridade (cadastro).
      - name: flag_deficiencia
        description: Sim/Não/Não Informado — possui deficiência (cadastro).
        data_tests:
          - accepted_values:
              values: ['Sim', 'Não', 'Não Informado']
      - name: tipo_deficiencia
        description: Tipo de deficiência traduzido (Deficiência auditiva total/parcial, visual parcial/total, motora, mental ou intelectual).
      - name: flag_uso_substancias_psicoativas
        description: |
          Sim/Não Informado — o usuário faz uso de substâncias psicoativas — formulário
          'Situação de Saúde' (campo 'Faz uso de substâncias psicoativas?');
          fallback no cadastro (grau_dependencia 1/2/3) quando não há formulário.
      - name: flag_problema_saude
        description: |
          Sim/Não/Não Informado — o usuário tem ou teve problema de saúde — formulário
          'Situação de Saúde' (campo 'Situação'); fallback no cadastro
          (flag_saude_mental_comprometida) quando não há formulário.
      - name: flag_acompanhamento_saude
        description: |
          Sim/Não Informado — o usuário realiza acompanhamento de saúde — formulário
          'Situação de Saúde' (campo 'Local onde faz tratamento'). Sem fallback.
      - name: flag_possui_vinculo_familiar
        description: Sim/Não/Não Informado — possui referências familiares (formulário Centro POP - Atendimento Social).
      - name: territorio_referencia_familia
        description: NULL — campo ainda não disponível na fonte.
      - name: flag_possibilidade_reinsercao_familiar
        description: NULL — campo ainda não disponível na fonte.
      - name: flag_exerce_atividade_renda
        description: Exerce atividade que gera renda (cadastro).
      - name: atividade_renda_qual
        description: Qual atividade que gera renda (cadastro).
      - name: valor_renda
        description: Valor da renda obtida através da atividade (cadastro).
      - name: flag_empregabilidade_imediata
        description: NULL — campo ainda não disponível na fonte.
      - name: capacidade_habilidades
        description: NULL — campo ainda não disponível na fonte.
      - name: flag_interesse_curso
        description: NULL — campo ainda não disponível na fonte.
      - name: flag_possui_beneficio
        description: Sim/Não/Não Informado — possui benefício (cadastro).
      - name: tipo_beneficio
        description: Tipo(s) de benefício (códigos do cadastro).
      - name: beneficio
        description: Códigos e descrições dos benefícios separados por vírgula.
      - name: data_atualizacao_cadunico
        description: |
          Data DATE da atualização da família CadÚnico ligada ao usuário por CPF →
          raw_documento_pessoa.id_familia → raw_identificacao_controle.id_familia.
          Só preenchida quando o CPF identifica uma única família CadÚnico; não usa
          dim_familias.id_familia, que pertence ao prontuário.
      - name: nis_usuario
        description: NIS do usuário (CadÚnico, via CPF).
      - name: flag_participacao_oficinas
        description: Sim/Não — o usuário participou de oficina/atividade coletiva no mês na unidade.
      - name: qtd_oficinas_participadas_mes
        description: Quantidade de oficinas participadas no mês de referência; zero quando não há registro agregado de participação.
      - name: demandas
        description: Demandas dos formulários PAI e Atendimento Social, separadas por vírgula e prefixadas pela origem.
      - name: encaminhamentos
        description: |
          Encaminhamentos dos formulários PAI e Atendimento Social, separados por
          vírgula e prefixados pela origem — inclui os tópicos 'Encaminhamentos – Saúde',
          '– Órgãos', '– Rede Socioassistencial' e '– Benefícios'; valores 'undefined'
          são ignorados.
      - name: resultado_acesso
        description: NULL — campo ainda não disponível na fonte.
      - name: resultado_descricao
        description: NULL — campo ainda não disponível na fonte.
      - name: data_desligamento
        description: Data de desligamento do acompanhamento (formulário Centro POP - Desligamento PAI).
      - name: motivo_desligamento
        description: Motivo do desligamento (inclui campo Outros, concatenado).
      - name: observacoes
        description: NULL — campo ainda não disponível na fonte.
      - name: flag_situacao_rua
        description: Situação de rua do usuário (cadastro saúde mental).
      - name: ultima_atualizacao
        description: Última atualização da origem (sys_config).
