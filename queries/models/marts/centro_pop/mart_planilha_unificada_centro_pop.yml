version: 2
models:
  - name: mart_planilha_unificada_centro_pop
    description: |-
      Planilha Unificada Centro POP: uma linha por atendimento não cancelado, com profissionais compartilhados agregados. Chave: id_atendimento. A mart utiliza o número original como identificador único no recorte Centro POP. Nº é apenas sequência de apresentação. Pessoas, unidades, meses e tipos podem ser agrupados no Looker. Para contar atendimentos, use COUNT(DISTINCT id_atendimento); para contar pessoas, use COUNT(DISTINCT id_usuario).

      Dados do evento são escalares: id_atendimento, data_atendimento, nome_atendimento e tipo_atendimento. Profissionais são uma lista textual distinta do próprio evento. id_usuario_unidade_mes é uma chave de agrupamento repetida, não a chave da mart. Os totais mensais de atendimentos e os arrays atendimentos/atendimentos_por_tipo foram removidos; as contagens são calculadas no Looker.

      Regras temporais: PAI e último perfil social/saúde/desligamento são selecionados até o fim do mês; demandas, encaminhamentos e observações são agregados de todos os formulários do mês. Idade é calculada no fechamento. Presença de PAI não equivale a acompanhamento ativo. Pontual significa atendimento de tipo diferente de PAI; a pessoa pode ter as duas condições no mesmo mês. Perfil, demandas, encaminhamentos, observações, datas mensais e quantidade de oficinas são contexto do usuário/unidade/mês repetido em cada evento. Não representam necessariamente o conteúdo daquele atendimento. No Looker, a quantidade mensal de oficinas requer MAX por id_usuario_unidade_mes, nunca SUM entre atendimentos; renda também é atributo cadastral, não medida aditiva de atendimento.

      Cadastro, documentos e CadÚnico representam snapshots atuais: não há reconstrução retroativa desses atributos. CPF vem do prontuário; RG, certidão e NIS vêm do CadÚnico por CPF. CPF com família/documento/NIS ambíguo não recebe valor arbitrário. Ausência de evidência documental não é convertida em Não. Números ausentes são apresentados como traço; flags desconhecidas usam Não Informado; datas, valores e IDs preservam tipos e NULL.

      Cobertura da planilha: todas as 50 colunas estão mapeadas em columns.meta.colunas_planilha. Campos sem coleta: empregabilidade, habilidades, interesse em curso, resultado/acesso e resultado/descrição dependem de inclusão no sistema. Motivo principal tem pergunta estruturada, porém sem respostas; observações têm extrator, porém o bloco não é exportado nos formulários atuais. Território familiar e reinserção têm campos reais e são extraídos. Oficinas usam presenças registradas; não há registros de Centro POP nas fontes auditadas. Sem evidência de participação, flag e quantidade permanecem desconhecidas, sem inventar Não ou zero. A coleta deve ser disponibilizada/preenchida nas atividades de grupo ou atendimentos, conforme a planilha. A classificação do evento permite calcular no Looker as quantidades opcionais por tipo da coluna 12.

      Decisões de consolidação: profissional de referência é a lista de profissionais do atendimento, conforme origem Login. Idade informada é derivada do nascimento cadastral no fim do mês. Atualização do CadÚnico usa o prazo oficial do snapshot; data declarada no prontuário é exposta separadamente, sem supor equivalência com atualização oficial.
    meta:
      planilha_url: https://docs.google.com/spreadsheets/d/1me-dxFcE-SZ_WgZ75_sq1t92Se1zwxk9YPgZ_YYMKu8/edit
      granularidade: [id_atendimento]
      auditoria_fontes: '2026-10-01'
    columns:
      - name: numero
        description: Número sequencial para apresentação, ordenado por mês/unidade/usuário/data/atendimento. Não
          é um identificador persistente; use id_atendimento como chave.
        meta: {colunas_planilha: [1], situacao_planilha: disponivel}
      - name: id_atendimento
        description: Número original do atendimento, usado como chave única nesta mart Centro POP. Usar COUNT(DISTINCT id_atendimento)
          para contar eventos no Looker. A unicidade é verificada pelo teste; a numeração não é garantida como única entre módulos fora deste recorte.
        data_tests: [not_null, unique]
      - name: data_atendimento
        description: Data do próprio atendimento; determina o mês de referência.
      - name: tipo_atendimento
        description: 'Classificação do evento: Atendimento Técnico quando possui profissional de nível superior
          (grupo CBO 2); senão Atendimento Recepção conforme tipo/profissional; demais são Outros Atendimentos.
          Permite calcular as contagens opcionais por tipo no Looker.'
        meta: {colunas_planilha: [12], situacao_planilha: opcional_conforme_observacao}
      - name: id_usuario_unidade_mes
        description: Chave estável de agrupamento usuário × unidade × mês, repetida nos atendimentos desse grupo.
          Não é única na mart; serve para agrupar o contexto mensal no Looker.
      - name: id_usuario
        description: Identificador do usuário no prontuário (id_paciente).
      - name: id_familia
        description: ID da família (Cadastro de Famílias, via usuário responsável). NULL se o usuário não é responsável
          de família registrada.
      - name: id_unidade
        description: Identificador da unidade Centro POP.
      - name: nome_centro_pop
        description: Nome da unidade Centro POP; se a dimensão tiver nomes divergentes, são apresentados em ordem
          alfabética separados por ' | '.
        meta: {colunas_planilha: [3], situacao_planilha: disponivel}
      - name: mes_referencia
        description: Primeiro dia do mês do atendimento. Use para agrupar os eventos mensalmente no Looker.
        meta: {colunas_planilha: [2], situacao_planilha: disponivel}
      - name: data_referencia
        description: Último dia do mês de referência; limite para seleção de formulários e referência do cálculo
          da idade.
      - name: data_primeiro_atendimento_mes
        description: Primeira data de atendimento do usuário/unidade no mês.
      - name: data_ultimo_atendimento_mes
        description: Última data de qualquer atendimento do usuário/unidade no mês.
      - name: data_ultimo_atendimento_tecnico_mes
        description: Última data de atendimento com ao menos um profissional de nível superior (grupo CBO 2). Não
          inclui recepção sem profissional de nível superior.
        meta: {colunas_planilha: [11], situacao_planilha: disponivel}
      - name: nome_atendimento
        description: Nome do tipo de atendimento do evento na fonte. Não Informado quando ausente.
        meta: {colunas_planilha: [44], situacao_planilha: disponivel}
      - name: profissionais_atendimento
        description: Profissionais do próprio atendimento, sem duplicatas, em ordem alfabética e separados por vírgula.
          Atende à origem Login da coluna Profissional de referência; a fonte não define um profissional de referência
          designado. Profissionais compartilhados não multiplicam linhas.
        meta: {colunas_planilha: [4], situacao_planilha: disponivel}
      - name: nome_usuario
        description: Nome do usuário do serviço (cadastro).
        meta: {colunas_planilha: [5], situacao_planilha: disponivel}
      - name: nome_social
        description: Nome social do usuário (cadastro).
        meta: {colunas_planilha: [6], situacao_planilha: disponivel}
      - name: flag_atendido_pontualmente
        description: Sim quando o tipo deste atendimento é diferente de PAI. Não para CENTRO POP - Plano de acompanhamento
          indiv. (PAI) e Centro POP - Plano de Atendimento Individual (PAI); Não Informado quando o tipo está ausente.
          Pode ser Sim junto com flag_possui_plano_individual, pois este indica evidência mensal de formulário PAI.
        data_tests:
          - accepted_values:
              values: [Sim, Não, Não Informado]
        meta: {colunas_planilha: [7], situacao_planilha: disponivel}
      - name: flag_inserido_acompanhamento
        description: Sim/Não — existe formulário Centro POP - Plano de Atendimento Individual (PAI) conhecido até
          o fechamento do mês. Não indica acompanhamento ativo e não é revertida automaticamente por desligamento.
        data_tests:
          - accepted_values:
              values: [Sim, Não]
        meta: {colunas_planilha: [8], situacao_planilha: disponivel}
      - name: flag_possui_plano_individual
        description: Sim/Não — existe formulário PAI conhecido até o fechamento do mês. Outros formulários da abrangência
          29 não contam como evidência de PAI.
        data_tests:
          - accepted_values:
              values: [Sim, Não]
        meta: {colunas_planilha: [10], situacao_planilha: disponivel}
      - name: data_inclusao_acompanhamento
        description: Primeira data do campo Data do atendimento dos formulários PAI conhecidos até o fechamento
          do mês. Aceita DD/MM/AAAA e AAAA-MM-DD, com ou sem horário. Quando ausente ou inválida, usa a data da
          evolução como fallback documentado. Datas de inclusão e registros posteriores ao fechamento não entram.
        meta: {colunas_planilha: [9], situacao_planilha: disponivel}
      - name: motivo_principal_permanencia_rua
        description: Campo Motivo da ida às ruas do questionário cadastral Situação do Usuário (template 3, questão
          18), última resposta até o fechamento. Fonte sem respostas na auditoria de 01/10/2026; depende de disponibilizar/preencher
          essa coleta. Não utiliza Motivo do acolhimento como substituto.
        meta: {colunas_planilha: [13], situacao_planilha: coleta_indisponivel}
      - name: motivo_secundario_permanencia_rua
        description: Campo Motivo secundário da ida às ruas do último formulário Centro POP - Atendimento Social
          registrado até o fechamento. Não utiliza o campo Outros do Acolhimento.
        meta: {colunas_planilha: [14], situacao_planilha: disponivel}
      - name: data_nascimento
        description: Data de nascimento (cadastro).
        meta: {colunas_planilha: [15], situacao_planilha: disponivel}
      - name: idade
        description: Idade completa calculada a partir do nascimento cadastral no fechamento do mês. A coluna Idade
          informada da planilha é atendida por essa derivação; não existe um campo de idade declarada nas fontes
          usadas.
        meta: {colunas_planilha: [16], situacao_planilha: derivado_do_nascimento}
      - name: filiacao_mae
        description: Nome da mãe (cadastro).
        meta: {colunas_planilha: [17], situacao_planilha: disponivel}
      - name: flag_possui_cpf
        description: Sim/Não Informado — Sim quando o CPF está informado no cadastro do usuário; a fonte não fornece
          um indicador confiável de ausência.
        data_tests:
          - accepted_values:
              values: [Sim, Não Informado]
        meta: {colunas_planilha: [18], situacao_planilha: disponivel_com_limitacoes_da_fonte}
      - name: numero_cpf
        description: CPF textual de raw_usuarios.cpf, preservando zeros à esquerda. Traço quando ausente, conforme
          apresentação solicitada pela planilha.
        meta: {colunas_planilha: [18], situacao_planilha: disponivel_com_limitacoes_da_fonte}
      - name: flag_possui_rg
        description: Sim/Não Informado — Sim quando há um único número de RG no registro CadÚnico associado pelo
          CPF; ausência de vínculo, conflito ou ausência do número ficam Não Informado.
        data_tests:
          - accepted_values:
              values: [Sim, Não Informado]
        meta: {colunas_planilha: [18], situacao_planilha: disponivel_com_limitacoes_da_fonte}
      - name: numero_rg
        description: RG do CadÚnico associado por CPF; remove padding de zeros à esquerda. Só apresenta um número
          quando único após normalização; traço para ausência/conflito.
        meta: {colunas_planilha: [18], situacao_planilha: disponivel_com_limitacoes_da_fonte}
      - name: flag_possui_certidao_nascimento
        description: Sim/Não Informado — Sim quando raw_documento_pessoa registra tipo de certidão 1 (nascimento);
          ausência de vínculo ou de evidência não presume ausência do documento.
        data_tests:
          - accepted_values:
              values: [Sim, Não Informado]
        meta: {colunas_planilha: [18], situacao_planilha: disponivel_com_limitacoes_da_fonte}
      - name: numero_certidao_nascimento
        description: Matrícula da certidão de nascimento (id_certidao_civil=1), preservando zeros à esquerda. Só
          apresenta um número quando único; traço para ausência/conflito.
        meta: {colunas_planilha: [18], situacao_planilha: disponivel_com_limitacoes_da_fonte}
      - name: genero
        description: Gênero informado no cadastro.
        meta: {colunas_planilha: [19], situacao_planilha: disponivel}
      - name: orientacao_sexual
        description: Orientação sexual informada no cadastro.
        meta: {colunas_planilha: [20], situacao_planilha: disponivel}
      - name: raca_cor
        description: Cor e etnia informada no cadastro.
        meta: {colunas_planilha: [21], situacao_planilha: disponivel}
      - name: naturalidade
        description: UF de nascimento (cadastro).
        meta: {colunas_planilha: [22], situacao_planilha: disponivel}
      - name: flag_estuda
        description: Sim/Não/Não Informado — estuda (cadastro).
        data_tests:
          - accepted_values:
              values: [Sim, Não, Não Informado]
        meta: {colunas_planilha: [23], situacao_planilha: disponivel}
      - name: ano_cursando
        description: Série informada no cadastro somente quando o usuário estuda (S/Sim); demais casos são Não Informado.
        meta: {colunas_planilha: [24], situacao_planilha: disponivel}
      - name: nivel_escolaridade
        description: Nível de escolaridade (cadastro).
        meta: {colunas_planilha: [25], situacao_planilha: disponivel}
      - name: flag_deficiencia
        description: Sim/Não/Não Informado — possui deficiência (cadastro).
        data_tests:
          - accepted_values:
              values: [Sim, Não, Não Informado]
        meta: {colunas_planilha: [26], situacao_planilha: disponivel}
      - name: tipo_deficiencia
        description: Tipo de deficiência traduzido (Deficiência auditiva total/parcial, visual parcial/total, motora,
          mental ou intelectual).
        meta: {colunas_planilha: [26], situacao_planilha: disponivel}
      - name: flag_uso_substancias_psicoativas
        description: Sim/Não/Não Informado — resposta explícita do formulário Situação de Saúde conhecido até o
          fechamento. Não usa grau_dependencia, que descreve dependência em atividades diárias.
        data_tests:
          - accepted_values:
              values: [Sim, Não, Não Informado]
        meta: {colunas_planilha: [27], situacao_planilha: disponivel}
      - name: flag_problema_saude
        description: 'Sim quando há situação de saúde registrada ou evidência explícita de agravo/diagnóstico de
          saúde mental. Não somente por resposta negativa explícita da situação de saúde; ausência de agravo mental
          não prova ausência de outros problemas. Demais casos: Não Informado.'
        data_tests:
          - accepted_values:
              values: [Sim, Não, Não Informado]
        meta: {colunas_planilha: [28], situacao_planilha: disponivel}
      - name: flag_acompanhamento_saude
        description: Sim quando o último formulário Situação de Saúde informa local de tratamento até o fechamento.
          Não por resposta negativa explícita; ausência de informação permanece Não Informado.
        data_tests:
          - accepted_values:
              values: [Sim, Não, Não Informado]
        meta: {colunas_planilha: [29], situacao_planilha: disponivel}
      - name: flag_possui_vinculo_familiar
        description: Sim/Não/Não Informado — campo Possui referências familiares? do último Atendimento Social até
          o fechamento.
        data_tests:
          - accepted_values:
              values: [Sim, Não, Não Informado]
        meta: {colunas_planilha: [30], situacao_planilha: disponivel}
      - name: territorio_referencia_familia
        description: Campo Território da referência familiar do último Atendimento Social até o fechamento. Confirmado
          como disponível na auditoria da fonte.
        meta: {colunas_planilha: [31], situacao_planilha: disponivel}
      - name: flag_possibilidade_reinsercao_familiar
        description: Sim/Não/Não Informado — campo Existe possibilidade de reinserção familiar? do último Atendimento
          Social até o fechamento. Confirmado como disponível na auditoria da fonte.
        meta: {colunas_planilha: [32], situacao_planilha: disponivel}
      - name: flag_exerce_atividade_renda
        description: Sim/Não/Não Informado — flag_trabalha do cadastro de saúde mental. Não infere trabalho a partir
          de renda diferente de zero.
        data_tests:
          - accepted_values:
              values: [Sim, Não, Não Informado]
        meta: {colunas_planilha: [33], situacao_planilha: disponivel}
      - name: atividade_renda_qual
        description: Qual atividade que gera renda (cadastro).
        meta: {colunas_planilha: [33], situacao_planilha: disponivel}
      - name: valor_renda
        description: Valor da renda obtida através da atividade (cadastro).
        meta: {colunas_planilha: [34], situacao_planilha: disponivel}
      - name: flag_empregabilidade_imediata
        description: Não Informado — depende da inclusão do campo Está pronto para empregabilidade imediata? no
          Atendimento Social, conforme a planilha.
        meta: {colunas_planilha: [35], situacao_planilha: depende_sistema}
      - name: capacidade_habilidades
        description: Não Informado — depende da inclusão de Capacidade/habilidades no Atendimento Social. Potencialidades
          verificadas do PAI não é usado como substituto sem equivalência de negócio.
        meta: {colunas_planilha: [36], situacao_planilha: depende_sistema}
      - name: flag_interesse_curso
        description: Não Informado — depende da inclusão de Tem interesse em fazer curso? no Atendimento Social.
          Interesse em atividades coletivas não equivale a interesse em curso.
        meta: {colunas_planilha: [37], situacao_planilha: depende_sistema}
      - name: flag_possui_beneficio
        description: Sim/Não/Não Informado — possui benefício (cadastro).
        data_tests:
          - accepted_values:
              values: [Sim, Não, Não Informado]
        meta: {colunas_planilha: [38], situacao_planilha: disponivel}
      - name: tipo_beneficio
        description: Tipo(s) de benefício (códigos do cadastro).
      - name: beneficio
        description: Códigos e descrições dos benefícios separados por vírgula.
        meta: {colunas_planilha: [38], situacao_planilha: disponivel}
      - name: flag_possui_cadunico
        description: Sim/Não/Não Informado — indicador cadastral disponível em dim_usuarios.flag_cadunico. Não é
          inferido da existência de NIS.
        meta: {colunas_planilha: [39], situacao_planilha: disponivel}
      - name: data_cadunico_informada
        description: 'Data de CadÚnico informada no prontuário (raw_usuarios_detalhes.data_cadunico / datcadunico).
          Mantida separada da atualização oficial do CadÚnico: a fonte não garante que as duas datas tenham o mesmo
          significado.'
        meta: {colunas_planilha: [40], situacao_planilha: disponivel_com_limitacoes_da_fonte}
      - name: data_atualizacao_cadunico
        description: Atualização do snapshot oficial CadÚnico por CPF → família CadÚnico → identificacao_controle.
          Só informada se o CPF aponta para uma única família. Não é substituída pela data declarada no prontuário.
        meta: {colunas_planilha: [40], situacao_planilha: disponivel_com_limitacoes_da_fonte}
      - name: data_limite_atualizacao_cadunico
        description: Prazo informado pelo próprio snapshot CadÚnico (data_limite_catastro_atual), sem inventar um
          intervalo de validade.
        meta: {colunas_planilha: [40], situacao_planilha: disponivel_com_limitacoes_da_fonte}
      - name: flag_cadunico_atualizado
        description: Sim se o prazo oficial do CadÚnico ainda não venceu no fechamento do mês; Não se venceu. Não
          Informado sem vínculo unívoco, data/prazo oficial, ou se a atualização do snapshot é posterior ao fechamento.
          Não utiliza a data declarada no prontuário para deduzir prazo.
        meta: {colunas_planilha: [40], situacao_planilha: disponivel_com_limitacoes_da_fonte}
      - name: nis_usuario
        description: 'NIS do snapshot CadÚnico associado por CPF. Só apresenta NIS se único; ausência/conflito:
          Não Informado.'
        meta: {colunas_planilha: [41], situacao_planilha: disponivel}
      - name: flag_participacao_oficinas
        description: 'Sim quando há registro de participação em oficina/atividade coletiva na unidade e mês. Não
          Informado quando não há evidência. Não há presenças de Centro POP na raw/fato auditadas em 01/10/2026:
          depende de disponibilizar/preencher a coleta em atividades de grupo ou atendimentos. Falta de registro
          não significa Não.'
        data_tests:
          - accepted_values:
              values: [Sim, Não, Não Informado]
        meta: {colunas_planilha: [42], situacao_planilha: coleta_indisponivel}
      - name: qtd_oficinas_participadas_mes
        description: 'Quantidade de atividades distintas com participação registrada no mês. NULL quando não há
          evidência, sem inventar zero participações. Não há registros de Centro POP na fonte atual; depende de
          disponibilizar/preencher a coleta. Contexto mensal repetido em cada atendimento: usar MAX por id_usuario_unidade_mes
          no Looker, sem somar entre eventos.'
        meta: {colunas_planilha: [43], situacao_planilha: coleta_indisponivel}
      - name: demandas
        description: Todas as demandas registradas em formulários PAI e Atendimento Social no mês, deduplicadas,
          ordenadas e prefixadas pela origem. Separadas dos tipos de atendimento realizados.
        meta: {colunas_planilha: [44], situacao_planilha: disponivel}
      - name: encaminhamentos
        description: Todos os campos Encaminhamentos dos formulários PAI e Atendimento Social registrados no mês,
          inclusive Saúde, Órgãos, Rede Socioassistencial, Benefícios e Programas e Serviços. Deduplicados e prefixados
          por formulário e tópico; ignora undefined e vazio.
        meta: {colunas_planilha: [45], situacao_planilha: disponivel}
      - name: resultado_acesso
        description: Não Informado — depende de coleta de resultado/acesso vinculada ao encaminhamento no sistema.
        meta: {colunas_planilha: [46], situacao_planilha: depende_sistema}
      - name: resultado_descricao
        description: Não Informado — depende de coleta da descrição do resultado vinculada ao encaminhamento no
          sistema.
        meta: {colunas_planilha: [47], situacao_planilha: depende_sistema}
      - name: data_desligamento
        description: Data do desligamento no último formulário Centro POP - Desligamento PAI conhecido até o fechamento;
          aceita formatos de data brasileira e ISO com ou sem horário.
        meta: {colunas_planilha: [48], situacao_planilha: disponivel}
      - name: motivo_desligamento
        description: Motivo do desligamento do último formulário de Desligamento PAI até o fechamento, concatenado
          com Outros quando preenchido.
        meta: {colunas_planilha: [49], situacao_planilha: disponivel}
      - name: observacoes
        description: Observações dos formulários Centro POP registrados no mês, extraídas do bloco OBSERVAÇÕES ou
          CONTEÚDO E DESCRIÇÃO do HTML e sem tags. Nenhum desses blocos foi encontrado na auditoria de 01/10/2026;
          coleta/exportação do campo depende do sistema. Não usa texto arbitrário de evolução como substituto.
        meta: {colunas_planilha: [50], situacao_planilha: coleta_indisponivel}
      - name: flag_situacao_rua
        description: Situação de rua do usuário (cadastro saúde mental).
        data_tests:
          - accepted_values:
              values: [Sim, Não]
