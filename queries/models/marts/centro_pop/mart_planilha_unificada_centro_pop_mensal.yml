version: 2
models:
- name: mart_planilha_unificada_centro_pop_mensal
  description: '50 colunas da planilha Centro POP, por usuário/unidade/mês. Fonte
    única: planilha_unificada. Cadastro e documentos atuais; perfil até o fechamento.
    Naturalidade representa UF. Número é sequência de apresentação. Campos sem coleta
    permanecem vazios. Campos de PAI indicam evidência de formulário, não acompanhamento
    ativo. Último técnico considera todo o histórico até o fechamento na mesma unidade.
    Profissionais são os executores dos atendimentos do mês, não uma referência designada.
    Datas sem valor são NULL; textos sem coleta são vazios. Documentos sem número
    são traço; ausência não representa Não. Saúde usa registros até o fechamento.
    Oficinas sem evidência permanecem desconhecidas.'
