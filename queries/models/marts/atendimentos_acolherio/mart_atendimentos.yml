version: 2
models:
  - name: mart_atendimentos
    description: >
      Base ampla de atendimentos do Looker AcolheRio, com uma linha por
      atendimento do módulo. Preserva os nomes das colunas legadas e acrescenta
      atributos de auditoria e filtro. Inclui cancelados, registros TESTE,
      vínculos familiares encerrados e atendimentos sem cadastros associados.
      Os ranks são atributos para filtros opcionais no Looker; não excluem
      linhas. Materializado como atendimentos, sem substituir a tabela legada dev_atendimentos.
    columns:
      - name: ID_ATENDIMENTO
        description: >
          Identificador do atendimento incluindo o módulo, igual a ID_ATENDIMENTO_MODULO.
          Não inclui o profissional.
      - name: ID_ATENDIMENTO_SK
        description: Hash de ID_ATENDIMENTO_MODULO, independente dos profissionais.
        data_tests:
          - unique
          - not_null
      - name: DATA_DE_ATENDIMENTO
        description: Data da origem, preservada mesmo quando ausente.
      - name: modulo
        data_tests:
          - accepted_values:
              arguments:
                values: ['u', 'f']
      - name: FLAG_CANCELADO
        description: Indicador de cancelamento da origem; não é aplicado como filtro no dbt.
      - name: DATA_SAIDA_ATENDIMENTO
        description: Data de saída do atendimento (dtsaida), distinta da saída do vínculo familiar.
      - name: DATA_SAIDA_VINCULO_FAMILIAR
        description: >
          Saída do vínculo familiar selecionado para o módulo usuário.
          Prioriza vínculo aberto; quando só há encerrados, seleciona o de saída mais recente.
      - name: VINCULOS_FAMILIARES
        description: >
          Todos os vínculos familiares do usuário em ARRAY de STRUCT,
          incluindo entrada, saída, motivo de saída e família de destino.
          O vínculo resumido não representa uma reconstrução na data do atendimento.
      - name: PROFISSIONAL_CBOS
        description: Todos os códigos e descrições de CBO do profissional principal em ARRAY de STRUCT.
      - name: PROFISSIONAL_NOME_CADASTRAL
        description: Nome original do profissional principal, antes da substituição pelo nome do operador.
      - name: EMAIL
        description: >
          Concatena e-mail da CAS, da unidade e todos os e-mails distintos da planilha.
          Componentes ausentes não anulam os demais e-mails.
      - name: EMAIL_PLANILHA
        description: Todos os e-mails distintos da planilha para a unidade, em ordem alfabética.
      - name: FLAG_USUARIO_CADASTRADO
        description: Indica correspondência com o cadastro de usuário; ausência não exclui atendimento.
      - name: FLAG_UNIDADE_CADASTRADA
        description: Indica correspondência com o cadastro de unidade.
      - name: FLAG_OPERADOR_CADASTRADO
        description: Indica correspondência com o cadastro do operador cadastrante.
      - name: FLAG_PROFISSIONAL_CADASTRADO
        description: Indica correspondência com o cadastro do profissional principal.
      - name: FLAG_USUARIO_TESTE
        description: Nome cadastral do usuário contém TESTE, sem distinguir maiúsculas e minúsculas.
      - name: FLAG_UNIDADE_TESTE
        description: Nome cadastral da unidade contém TESTE, sem distinguir maiúsculas e minúsculas.
      - name: FLAG_OPERADOR_TESTE
        description: Nome cadastral do operador contém TESTE, sem distinguir maiúsculas e minúsculas.
      - name: FLAG_PROFISSIONAL_TESTE
        description: Nome cadastral do profissional principal contém TESTE, sem distinguir caixa.
      - name: cbo_unico_rank
        description: Sempre 1 no grão atendimento; mantido por compatibilidade de nomes.
      - name: atendimento_unico_rank
        description: >
          Rank de atendimentos com usuário, unidade, data, hora e nome de atendimento
          iguais, independente dos profissionais. Todas as posições são mantidas.
      - name: PROJETOS_SOCIAIS
        description: Nomes distintos dos projetos atualmente ativos e não cancelados da família selecionada.
      - name: PROJETOS_SOCIAIS_HISTORICO
        description: >
          Todos os vínculos de projetos da família selecionada em ARRAY de STRUCT,
          incluindo inativos/cancelados e datas da origem. Snapshot do cadastro;
          não reconstrói o estado na data do atendimento.
      - name: ID_ATENDIMENTO_MODULO
        description: Identificador natural do atendimento incluindo o módulo (família ou usuário).
        data_tests:
          - unique
          - not_null
      - name: PROFISSIONAL_ID
        description: ID do profissional principal da origem; permanece NULL se não houver principal.
      - name: PROFISSIONAL
        description: Nome resumido do profissional principal, com a regra existente para profissionais genéricos.
      - name: PROFISSIONAIS
        description: >
          Todos os profissionais principais e compartilhados em ARRAY de STRUCT,
          com IDs, nomes, indicação de principal, CBOs, classificação e flags cadastrais.
          Preserva também a posição do principal ausente, com ID NULL.
      - name: QUANTIDADE_PROFISSIONAIS
        description: Quantidade de profissionais com ID informado; não conta a posição do principal ausente.
      - name: FLAG_ALGUM_PROFISSIONAL_TESTE
        description: Indica se qualquer profissional, principal ou compartilhado, tem nome cadastral contendo TESTE.
      - name: TIPO_ATENDIMENTO
        description: >
          Classificação com todos os CBOs de todos os profissionais, mantendo a indicação
          explícita de Recepção da origem. Nos demais casos, Técnico (Advogado, Assistente
          social, Pedagogo ou Psicólogo) tem prioridade sobre CBO de recepção com CadÚnico.
          Consolida Técnico se algum profissional for técnico; senão Recepção se algum
          for recepção; senão Outros Atendimentos.
          A classificação individual fica em PROFISSIONAIS.
      - name: NOME_ATENDIMENTO
        description: Nome resumido com as regras do profissional principal; nomes por profissional ficam em PROFISSIONAIS.
      - name: PROFISSIONAIS_NOMES
        description: Nomes distintos e não vazios dos profissionais, em ordem alfabética e separados por vírgula.
      - name: FLAG_ATENDIMENTO_COMPARTILHADO
        description: Indica presença de qualquer profissional compartilhado, mesmo quando o principal estiver ausente.
      - name: FLAG_REGISTRO_TESTE
        description: Indica TESTE no nome cadastral do usuário, unidade, operador ou qualquer profissional.
