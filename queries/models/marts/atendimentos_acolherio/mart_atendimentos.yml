version: 2

models:
  - name: mart_atendimentos
    description: |
      Dataviz geral com uma linha por usuário que possui atendimentos.
      O cadastro e o perfil social atual ficam no usuário; ATENDIMENTOS é um
      ARRAY de STRUCTs com todas as ocorrências e suas equipes, sem exclusões
      analíticas. Filtros de elegibilidade, testes e ranks pertencem ao dataviz.
      Projetos e serviços ficam no atendimento, pois dependem da família vinculada.
      Informações sociais e comorbidades refletem o cadastro atual, inclusive
      para atendimentos antigos. Consulte queries/docs/atendimentos_dataviz.md.
    columns:
      - name: ID_USUARIO
        description: Identificador natural do usuário, único na mart.
        data_tests: [unique, not_null]
      - name: ID_USUARIO_SK
        description: Chave técnica do usuário.
        data_tests: [unique, not_null]
      - name: QUANTIDADE_ATENDIMENTOS
        description: Quantidade de elementos em ATENDIMENTOS, antes de filtros do dataviz.
        data_tests: [not_null]
      - name: ATENDIMENTOS
        description: |
          ARRAY de STRUCTs ordenado por data, hora e ID, com todos os atendimentos
          do usuário. Cada elemento mantém ID com módulo, unidade, família,
          projetos, serviços, flags, ranks e PROFISSIONAIS com a equipe completa.
          As colunas profissionais do atendimento representam o principal.
          O rank de cada integrante do array PROFISSIONAIS é independente.
        data_tests: [not_null]
      - name: DOCUMENTACAO
        data_tests:
          - accepted_values:
              arguments:
                values: ['CPF informado', 'CPF não informado']
      - name: VIOLACOES
        description: Violações identificadas no cadastro e nas evoluções não canceladas do usuário.
      - name: BENEFICIOS
        description: Descrições dos benefícios do cadastro atual.
      - name: DEFICIENCIAS
        description: Descrições das deficiências do cadastro atual.
      - name: FLAG_SITUACAO_RUA
        description: Situação de rua no cadastro atual; Sim, Não ou Não Informado.
      - name: FLAG_POSSUI_COMORBIDADE
        description: Indicador atual de comorbidade; ausência não equivale a Não.
      - name: COMORBIDADES
        description: Texto livre de gh_pac_info_med, sem inferência de diagnóstico.
      - name: DATA_INFORMACAO_COMORBIDADES
        description: Data da informação de comorbidades registrada na origem.
      - name: LOCAL_TRATAMENTO_COMORBIDADES
        description: Local de tratamento informado no cadastro.
      - name: COMORBIDADES_DETALHES
        description: Dados originais e procedência da informação de comorbidades.
