version: 2
models:
  - name: mart_atendimentos
    description: Uma linha por atendimento, com profissionais agregados e perfil cadastral atual. Inclui TESTE, cancelados e cadastros ausentes; regras em docs/atendimentos_looker.md.
    columns:
      - name: ID_ATENDIMENTO_MODULO
        description: Chave natural do atendimento, incluindo o módulo.
        data_tests: [unique, not_null]
      - name: ID_ATENDIMENTO
        description: Igual a ID_ATENDIMENTO_MODULO, independente do profissional.
      - name: PROFISSIONAIS
        description: Todas as posições profissionais, com IDs, nomes, CBOs, classificação e flags; inclui principal ausente.
      - name: PROFISSIONAL_ID
        description: ID do principal; não é substituído por compartilhado quando ausente.
      - name: PROFISSIONAL_CBOS
        description: Todos os CBOs do principal; os campos resumidos usam o primeiro traduzível por código.
      - name: QUANTIDADE_PROFISSIONAIS
        description: Quantidade de profissionais com ID preenchido.
      - name: TIPO_ATENDIMENTO
        description: Consolida todos os profissionais, priorizando Técnico, depois Recepção, depois Outros.
      - name: NOME_ATENDIMENTO
        description: Resumo conforme o profissional principal; nomes individuais ficam em PROFISSIONAIS.
      - name: atendimento_unico_rank
        description: Rank por usuário, unidade, data, hora e nome original; calculado antes dos filtros do Looker.
      - name: cbo_unico_rank
        description: Sempre 1 no grão atendimento; mantido por compatibilidade.
      - name: DATA_SAIDA_VINCULO_FAMILIAR
        description: Saída do vínculo selecionado no módulo usuário; aberto tem prioridade sobre encerrados.
      - name: VINCULOS_FAMILIARES
        description: Todos os vínculos familiares, incluindo encerrados; não reconstitui a família na data do atendimento.
      - name: PROJETOS_SOCIAIS
        description: Nomes distintos dos projetos ativos e não cancelados da família selecionada.
      - name: PROJETOS_SOCIAIS_HISTORICO
        description: Todos os vínculos de projetos da família selecionada, incluindo inativos e cancelados.
      - name: SERVICOS_SOCIOASSISTENCIAIS
        description: Serviços não cancelados da família selecionada; PAIF (1), PAEFI (6) e IDs não mapeados.
      - name: SERVICOS_SOCIOASSISTENCIAIS_HISTORICO
        description: Todos os vínculos de serviços, incluindo unidade, operador, cadastro e cancelamento.
      - name: FLAG_POSSUI_VIOLACAO_DIREITO
        description: Sim para qualquer violação identificada; Não apenas com N cadastral sem violações; ausência é Não Informado.
        data_tests: &indicador_social
          - not_null
          - accepted_values:
              arguments: {values: ['Sim', 'Não', 'Não Informado']}
      - name: VIOLACOES_DETALHES
        description: Código, descrição e origem (cadastro, evolucao ou ambas).
      - name: FLAG_RECEBE_BENEFICIO
        description: Resposta explícita indrecbenef; não é inferida da lista de benefícios.
        data_tests: *indicador_social
      - name: BENEFICIOS_DETALHES
        description: Códigos e descrições distintos, sem marcadores N/vazios; códigos sem tradução permanecem visíveis.
      - name: FLAG_DEFICIENCIA
        description: Resposta explícita indpresdefi; não é inferida da lista de deficiências.
        data_tests: *indicador_social
      - name: DEFICIENCIAS_DETALHES
        description: Códigos e descrições distintos, sem marcadores N/vazios; códigos sem tradução permanecem visíveis.
      - name: FLAG_SITUACAO_RUA
        description: Sim para indmoradi=5; Não para 1–4, 6–9 e A–D; E, ausência e desconhecidos são Não Informado.
        data_tests: *indicador_social
      - name: FLAG_POSSUI_COMORBIDADE
        description: Resposta explícita indcomorb; não é inferida do texto de comorbidades.
        data_tests: *indicador_social
      - name: COMORBIDADES
        description: Texto livre dsccomorb, sem espaços nas pontas; vazio vira NULL, sem classificação clínica.
      - name: DATA_INFORMACAO_COMORBIDADES
        description: datcomorbinfo; não representa o início da condição.
      - name: LOCAL_TRATAMENTO_COMORBIDADES
        description: Texto livre dsclocaltratcomorb, sem espaços nas pontas; vazio vira NULL.
      - name: COMORBIDADES_DETALHES
        description: Registro original de gh_pac_info_med, com indicador, descrição, data/local de tratamento e cadastro.
      - name: modulo
        data_tests:
          - accepted_values:
              arguments: {values: ['u', 'f']}
