version: 2

models:
  - name: mart_atendimentos_acolherio
    description: |
      Mart de atendimentos do Prontuário Carioca de Assistência Social (AcolheRio),
      no grão atendimento × profissional (herdado do fct_atendimentos).
      Classifica o atendimento por tipo (Recepção / Técnico / Outros), faixa
      etária do usuário e enriquece com dimensões (profissional, unidade).
    columns:
      - name: id_atendimento_sk
        description: "Surrogate key do atendimento × profissional (hash de id_atendimento_modulo + id_profissional). Grão do mart."
        data_tests:
          - unique
          - not_null

      - name: id_atendimento
        description: "ID natural do atendimento no sistema."
        data_tests:
          - not_null

      - name: data_atendimento
        description: "Data do atendimento."
        data_tests:
          - not_null

      - name: email
        description: "E-mails da unidade de atendimento, para filtro de BI = macro filtro_email([dim_unidades.email_filtro]) (split por [,;\\n\\r\\t], trim, lower, descarta vazio, DISTINCT, ordenado asc, unido por ', '; NULL quando não há e-mail, nunca ',,'). Antes era concat(email_filtro, email_unidade, planilha) — duplicava token em ~99,9% das linhas — e a mart lia a planilha crua via source('dashboard_acolherio','filtro_email_dev'), violando a camada. Filtro aplicado no Looker (contains)."
        data_type: string
