version: 2
models:
- name: raw_abordagens_metadados
  description: Metadados de captura e edição do repeat ArcGIS; datas textuais preservadas
    conforme origem.
  columns:
  - name: globalid
    data_tests:
    - unique
    - not_null
  - name: timestamp_captura
    description: Instante de captura pelo pipeline ArcGIS; não é data do contato.
