version: 2

sources:
  - name: arcgis_raw
    description: "Survey de entrega do Cartão PIC — ArcGIS (SIURB)."
    database: rj-smas
    schema: arcgis_raw
    tables:
      - name: primeira_infancia_carioca_raw
        description: "Entregas reais, campos de retirada, profissionais."

models:
  - name: raw_survey_primeira_infancia
    description: >
      Survey de entrega do Cartão Primeira Infância Carioca (limpeza técnica).
      Um CPF pode ter múltiplos registros (retiradas/edições); o dedup de
      negócio (primeira entrega registrada no ArcGIS, por created_date ASC)
      é aplicado na int_status. Converte datas epoch_ms para TIMESTAMP e
      data_nascimento para DATE.
    tags: [weekly]
    columns:
      - name: cpf_sem_formatacao
        description: "CPF sem máscara (últimos 11 dígitos). Pode repetir (raw preserva todos os registros) e a fonte pode ter registro sem CPF."
      - name: data_entrega
        description: "Data da entrega (epoch_ms → TIMESTAMP), preenchida pelo operador."
      - name: created_date
        description: "Momento em que o registro foi criado no ArcGIS (epoch_ms → TIMESTAMP)."
      - name: data_nascimento
        description: "Data de nascimento do RF."
      - name: local_entrega
        description: "Local onde a entrega foi realizada."
