version: 2

sources:
  - name: arcgis_raw
    description: "Survey de entrega do Cartão PIC — ArcGIS (SIURB)."
    database: rj-smas
    schema: arcgis_raw
    tables:
      - name: primeira_infancia_carioca_raw
        description: "Entregas reais, campos de retirada, profissionais."

models:
  - name: raw_survey_primeira_infancia
    description: >
      Survey de entrega do Cartão Primeira Infância Carioca.
      Dedup por CPF (última versão por timestamp_captura). Converte datas
      epoch_ms para TIMESTAMP e data_nascimento para DATE.
    tags: [weekly]
    columns:
      - name: cpf_sem_formatacao
        description: "CPF sem máscara (últimos 11 dígitos)."
        tests: [not_null, unique]
      - name: data_entrega
        description: "Data da entrega (epoch_ms → TIMESTAMP)."
      - name: data_nascimento
        description: "Data de nascimento do RF."
      - name: local_entrega
        description: "Local onde a entrega foi realizada."