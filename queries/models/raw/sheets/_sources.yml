version: 2

sources:
  - name: dashboard_acolherio
    description: "Dataset auxiliar com planilhas de apoio do dashboard AcolheRio."
    database: rj-smas-dev
    schema: dashboard_acolherio
    tables:
      - name: filtro_email_dev
        description: "Planilha de filtro de e-mails por unidade de atendimento."

  - name: subpse_acolhimento
    description: "Dataset externo com dados de SMS (Google Sheets) para apuração da meta de acolhimento."
    database: rj-smas-dev
    schema: subpse_acolhimento
    tables:
      - name: consolidado_sms_acolhimento
        description: "Base externa (Google Sheets) com dados de acolhimento da SMS (Saúde)."
      - name: consolidado_sms_acolhimento_2026
        description: "Base externa (Google Sheets) com dados de acolhimento da SMS - 2026."