version: 2
models:
  - name: raw_usuarios
    description: "Dados cadastrais dos pacientes."
    columns:
      - name: id_paciente
        description: "ID original do paciente (seqpac)."
        tests:
          - not_null
          - unique
      - name: cpf
        description: "CPF do paciente."

      - name: numero_rg_cadastro
        description: RG cadastral original (numrg); presença define a flag pública de RG.

      - name: nis_cadastro
        description: NIS cadastral original em dsccns, preservado como informado.
