version: 2

sources:
  - name: prontuario_carioca_assistencia_social
    description: "Tabelas raw do Prontuário Carioca Assistência Social (Airbyte → BigQuery)."
    database: rj-smas
    schema: brutos_acolherio_staging
    tables:
      - name: gh_ativgrp
        description: "Atividades de grupo."
      - name: gh_atend_familia
        description: "Atendimentos de famílias."
      - name: gh_atendimentos
        description: "Atendimentos de usuários."
      - name: gh_ativ_paciente
        description: "Presenças de usuários em atividades."
      - name: gh_ativ_prof
        description: "Presenças de profissionais em atividades."
      - name: gh_cbo
        description: "Classificação Brasileira de Ocupações."
      - name: gh_cidadao_pac
        description: "Dados dos cidadãos/pacientes."
      - name: gh_contas
        description: "Contas de usuários do sistema."
      - name: gh_contas_us
        description: "Contas vinculadas a unidades."
      - name: gh_evoluadm
        description: "Evoluções administrativas."
      - name: gh_evolufamil
        description: "Evoluções de famílias."
      - name: gh_evolugrupo
        description: "Evoluções de grupo."
      - name: gh_evolupac
        description: "Evoluções de usuários."
      - name: gh_famil_projsociais
        description: "Projetos sociais das famílias."
