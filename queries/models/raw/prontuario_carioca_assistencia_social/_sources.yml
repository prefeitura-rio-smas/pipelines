        description: "Famílias cadastradas."
      - name: gh_familias_membros
        description: "Membros das famílias."
      - name: gh_origens
        description: "Origens de demanda."
      - name: gh_pac_ciclos
        description: "Ciclos de acolhimento dos pacientes."
      - name: gh_pac_dados
        description: "Dados detalhados dos pacientes."
      - name: gh_pacientes_sm
        description: "Pacientes com saúde mental."
      - name: gh_prof
        description: "Profissionais do sistema."
      - name: gh_profocup
        description: "Ocupações dos profissionais."
      - name: gh_tpatendimentos
        description: "Tipos de atendimento."
      - name: gh_tpatividades
        description: "Tipos de atividade."
      - name: gh_us
        description: "Unidades de atendimento."
      - name: gh_us_config
        description: "Configurações das unidades."
      - name: gh_us_smas
        description: "Capacidade das unidades SMAS."
      - name: gh_us_tipo
        description: "Tipos de unidade."
      - name: sys_config
        description: "Configurações globais do sistema (heartbeat da pipeline)."
