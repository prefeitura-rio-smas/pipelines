version: 2

sources:
  - name: brutos_acolherio_staging
    database: rj-smas
    schema: brutos_acolherio_staging
    tables:
      - name: gh_pac_info_med
        description: Informações médicas e comorbidades registradas no Prontuário Carioca.

models:
  - name: raw_usuarios_informacoes_medicas
    description: Dados médicos cadastrais disponíveis na origem, sem reconstrução histórica por atendimento.
    columns:
      - name: id_usuario
        description: ID original da pessoa (seqpac); unicidade depende da origem.
      - name: flag_possui_comorbidade
        description: Indicador original de comorbidade, sem normalização.
      - name: descricao_comorbidades
        description: Descrição original das comorbidades.
      - name: data_informacao_comorbidades
        description: Data informada para a informação médica, não a data do atendimento ou da extração.
      - name: local_tratamento_comorbidades
        description: Local de tratamento informado na origem.
      - name: data_cadastro
        description: Data de cadastro do registro na origem; não identifica necessariamente alterações.
      - name: id_unidade_cadastro
        description: Unidade que cadastrou a informação médica.
