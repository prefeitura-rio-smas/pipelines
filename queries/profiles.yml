rj_smas_dev:
  # alvo-padrão para quem for rodar local: DEV
  target: dev
  outputs:

    prod:
      type: bigquery
      method: service-account
      project: rj-smas
      dataset: gerenciamento__dbt
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      threads: 10
      location: US
      timeout_seconds: 300

    staging:
      type: bigquery
      method: oauth
      project: rj-smas-dev
      dataset: gerenciamento__dbt
      #keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS') }}"
      threads: 10
      location: US
      timeout_seconds: 300

    dev:
      type: bigquery
      method: oauth
      project: rj-smas-dev
      dataset: gerenciamento__dbt
      threads: 4
      location: US
      timeout_seconds: 300

    # P3 (PR #110): dataset dedicado por PR. A var schema_id é passada nos
    # workflows (--vars "schema_id: <PR>__<SHA>"). Default seguro
    # 'gerenciamento__dbt' para comandos locais/manuais (vira ci_gerenciamento__dbt).
    ci:
      type: bigquery
      method: oauth
      project: rj-smas-dev
      dataset: "ci_{{ var('schema_id', 'gerenciamento__dbt') }}"
      threads: 10
      location: US
