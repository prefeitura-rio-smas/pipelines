name: "queries"
version: "1.0"
profile: "rj_smas_dev"
model-paths: ["models"]

models:
  queries:
    # --- Nova Arquitetura Medallion ---
    raw:
      +materialized: view
      +schema: "{{ 'raw' if target.name == 'prod' else 'gerenciamento__dbt' }}"

      cadunico:
        +materialized: table
        +tags: ["weekly"]

    intermediate:
      +materialized: ephemeral
      core:
        +materialized: table
        +schema: "{{ 'core' if target.name == 'prod' else 'gerenciamento__dbt' }}"

      cartao_pic:
        +materialized: table
        +schema: "{{ 'core' if target.name == 'prod' else 'gerenciamento__dbt' }}"
        +tags: ["cartao_pic_status"]
    
    marts:
      +materialized: table
      +schema: "{{ 'marts' if target.name == 'prod' else 'relatorio' }}"

      core:
        dimensions:
          +schema: "{{ 'core' if target.name == 'prod' else 'gerenciamento__dbt' }}"
        facts:
          +schema: "{{ 'core' if target.name == 'prod' else 'gerenciamento__dbt' }}"

      cartao_pic:
        +schema: "{{ 'cartao_pic' if target.name == 'prod' else 'relatorio' }}"
        +tags: ["cartao_pic_status"]

        feedback:
          +schema: "{{ 'pic' if target.name == 'prod' else 'relatorio' }}"
          +tags: ["controle_cas"]

        meta_ar_cpf:
          +schema: "{{ 'pequenos_cariocas' if target.name == 'prod' else 'relatorio' }}"
          +tags: ["meta_ar_cpf"]

      atividades:
        +tags: ["daily"]

      poc_paif:
        +materialized: table
        +schema: "{{ 'marts' if target.name == 'prod' else 'relatorio' }}"

    # --- Arquitetura Antiga (Legacy) ---
    old_architecture:
      +enabled: false  # Default: disabled. Subgrupos com pipeline ativa sobrescrevem abaixo.

      dashboard_arcgis:
        +enabled: true  # Pipeline ArcGIS Abordagem (6/6h)
        +database: rj-smas-dev
        +materialized: table
        +schema: "{{ 'dashboard_arcgis' if target.name == 'prod' else 'gerenciamento__dbt' }}"

      equipamentos:
        +enabled: true  # Pipeline ArcGIS Equipamento (diário)
        +materialized: table
        +schema: "{{ 'equipamento' if target.name == 'prod' else 'gerenciamento__dbt' }}"

      dashboard_acolherio:
        raw:
          +materialized: ephemeral
        staging:
          +materialized: ephemeral
        intermediate:
          +materialized: ephemeral
        mart:
          +materialized: table
        +schema: "{{ 'acolherio' if target.name == 'prod' else 'relatorio' }}"

      rma:
        +schema: "{{ 'acolherio' if target.name == 'prod' else 'gerenciamento__dbt' }}"
        cras:
            raw:
              +materialized: ephemeral
            staging:
              +materialized: ephemeral
            intermediate:
              +materialized: incremental
            mart:
              +materialized: incremental
              +schema: "{{ 'dashboard_arcgis' if target.name == 'prod' else 'relatorio' }}"

      bolsa_familia:
        +enabled: true  # Pipeline Bolsa Família (manual/event-driven)
        +materialized: table
        +schema: "{{ 'bolsa_familia' if target.name == 'prod' else 'gerenciamento__dbt' }}"
