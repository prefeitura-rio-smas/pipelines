version: 2

macros:
  - name: map_resposta_sim_nao
    description: "Normaliza respostas S/Sim e N/Não/nao para Sim/Não, ignorando caixa e espaços nas pontas. Demais valores retornam Não Informado."
    arguments:
      - name: coluna
        type: string
        description: "Expressão SQL textual da resposta."

  - name: map_flag_situacao_rua
    description: "Traduz indmoradi: código 5 = Sim; códigos 1–4, 6–9 e A–D = Não; E, ausência e códigos fora do domínio = NULL. Normaliza espaços, caixa e representações inteiras dos códigos numéricos."
    arguments:
      - name: coluna
        type: string
        description: "Expressão SQL do código de moradia."

  - name: map_coluna_decisao_apoiada
    description: "Indica preenchimento cadastral do campo do processo de decisão apoiada: N para NULL, vazio ou somente espaços; S para valor preenchido."
    arguments:
      - name: coluna
        type: string
        description: "Expressão SQL do campo do processo de decisão apoiada."

  - name: map_coluna_escolaridade
    description: "Traduz códigos de indescolari, incluindo 09 = Especialização, 10 = Mestrado e 11 = Doutorado. Códigos sem tradução retornam NULL."
    arguments:
      - name: coluna
        type: string
        description: "Expressão SQL do código de escolaridade; separado do código de série indserie."

  - name: inicio_mes
    description: "Retorna o primeiro dia do mês de qualquer expressão SQL de data, datetime ou timestamp."
    arguments:
      - name: data_referencia
        type: string
        description: "Expressão SQL usada como referência."

  - name: fim_mes
    description: "Retorna o último dia do mês de qualquer expressão SQL de data, datetime ou timestamp."
    arguments:
      - name: data_referencia
        type: string
        description: "Expressão SQL usada como referência."

  - name: mes_referencia
    description: "Retorna o primeiro dia da competência mensal definida em uma variável do dbt; usa o mês corrente quando a variável estiver ausente ou vazia."
    arguments:
      - name: nome_variavel
        type: string
        description: "Nome da variável dbt no formato AAAA-MM. Padrão: competencia."

  - name: fim_mes_referencia
    description: "Retorna o último dia da competência mensal definida em uma variável do dbt."
    arguments:
      - name: nome_variavel
        type: string
        description: "Nome da variável dbt no formato AAAA-MM. Padrão: competencia."

  - name: no_mes
    description: "Gera um predicado de intervalo semiaberto para verificar se uma data pertence ao mês de referência."
    arguments:
      - name: col_data
        type: string
        description: "Expressão SQL que contém a data a testar."
      - name: data_referencia
        type: string
        description: "Expressão SQL opcional; quando omitida, usa mes_referencia()."

  - name: nao_cancelado
    description: "Gera o predicado de registro não cancelado para uma flag ou uma coluna de data de cancelamento."
    arguments:
      - name: coluna
        type: string
        description: "Expressão SQL da flag ou data de cancelamento."
      - name: valor_cancelado
        type: string
        description: "Valor que representa cancelamento; use none para exigir que a coluna seja nula."
