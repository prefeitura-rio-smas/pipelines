version: 2
macros:
  - name: vigencia_no_fechamento
    description: Estoque mensal no intervalo de vigência [início, encerramento), conforme regra preexistente do RMA CRAS; início desconhecido não comprova estoque.
    arguments:
      - name: inicio
        type: string
        description: Expressão SQL da data de ingresso.
      - name: encerramento
        type: string
        description: Expressão SQL da data de encerramento; NULL significa intervalo aberto.
      - name: competencia
        type: string
        description: Expressão SQL do mês cuja data de fechamento será avaliada.
  - name: classificar_atividade_rma
    description: Retorna flags SCFV, não continuado e grupo regular PAIF usando a regra existente do RMA CRAS, compartilhada com os fatos unificados.
    arguments:
      - name: relacao
        type: string
        description: Alias da relação com id_tipo_atividade, recorrencia, nome_atividade e nome_tipo_atividade.
  - name: nome_servico_socioassistencial
    description: Nomeia PAIF (1), PAEFI (6) e mantém IDs dos demais serviços como não mapeados; sem inferir equivalência.
    arguments:
      - name: coluna
        type: string
        description: Expressão SQL do código do serviço na origem.
