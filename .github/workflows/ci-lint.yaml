name: CI - Lint

on:
  pull_request:
    paths:
      - 'pipelines/**'
      - 'queries/**'
      - 'pyproject.toml'
      - '.sqlfluff'
      - 'Dockerfile'

concurrency:
  group: ci-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DBT_PROFILES_DIR: queries
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.12.4'

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (dbt)
        run: uv sync --all-extras --dev

      - name: Lint changed Python files with Ruff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          git cat-file -e "${BASE_SHA}^{commit}"

          mapfile -d '' -t files < <(
            git diff --name-only -z "$BASE_SHA...HEAD" -- 'pipelines/**' '*.py' |
            while IFS= read -r -d '' file; do
              case "$file" in
                *.py) printf '%s\0' "$file" ;;
              esac
            done
          )

          if ((${#files[@]} == 0)); then
            echo "Nenhum arquivo .py alterado."
            exit 0
          fi

          uv run python -m ruff check "${files[@]}"

      - name: Install SQLFluff (dbt templater)
        run: |
          uv tool install sqlfluff --with sqlfluff-templater-dbt --with dbt-bigquery
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: DBT Deps
        run: uv run dbt deps --project-dir queries --profiles-dir queries

      - name: Set up GCP credentials
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          echo "$GCP_CREDENTIALS" > /tmp/gcp-creds.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-creds.json" >> "$GITHUB_ENV"

      - name: Lint changed SQL files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          printf 'dbt_packages/\nmacros/\ntarget/\n' > .sqlfluffignore

          git cat-file -e "${BASE_SHA}^{commit}"

          mapfile -d '' -t files < <(
            git diff --name-only -z "$BASE_SHA...HEAD" -- queries/ |
            while IFS= read -r -d '' file; do
              case "$file" in
                queries/dbt_packages/*) ;;
                *.sql) printf '%s\0' "$file" ;;
              esac
            done
          )

          if ((${#files[@]} == 0)); then
            echo "Nenhum arquivo .sql alterado em queries/."
            exit 0
          fi

          # Lint por diff: só reprova violações em linhas alteradas pelo PR.
          # O sqlfluff linta o arquivo inteiro, mas arquivos legados têm dívida
          # de estilo pré-existente fora do escopo do PR; filtramos o JSON de
          # violações pelas linhas que este PR realmente tocou.
          exit_code=0
          for file in "${files[@]}"; do
            changed_file="$(mktemp)"
            json_file="$(mktemp)"
            git diff -U0 "$BASE_SHA...HEAD" -- "$file" |
              awk '
                /^@@/ {
                  match($0, /\+[0-9]+(,[0-9]+)?/);
                  hunk = substr($0, RSTART, RLENGTH);
                  sub(/^\+/, "", hunk);
                  split(hunk, a, ",");
                  start = a[1] + 0;
                  count = (a[2] == "" ? 1 : a[2] + 0);
                  for (i = 0; i < count; i++) print start + i;
                }
              ' > "$changed_file"

            echo "== Lintando (diff-only): $file =="
            # sqlfluff sai com código != 0 se houver QUALQUER violação no
            # arquivo (inclusive linhas fora do diff); por isso o `|| true` e o
            # processamento do JSON em passo separado (evita o pipefail).
            sqlfluff lint "$file" --format json > "$json_file" 2>/dev/null || true
            if CHANGED_FILE="$changed_file" python3 -c 'import json,os,sys; ch={int(x) for x in open(os.environ["CHANGED_FILE"]).read().split()}; r=json.load(open(sys.argv[1])); k=[(os.path.basename(i.get("filepath","")),v["start_line_no"],v["code"],v.get("description","")) for i in r for v in i.get("violations",[]) if v.get("start_line_no") in ch]; [print("{}: L{}  {}  {}".format(*t)) for t in k]; sys.exit(1 if k else 0)' "$json_file"; then
              rc=0
            else
              rc=$?
            fi
            rm -f "$changed_file" "$json_file"
            if [ "$rc" -ne 0 ]; then
              exit_code=$rc
            fi
          done

          exit "$exit_code"
