name: CI schema drop on PR close

on:
  pull_request:
    types:
      - closed

concurrency:
  group: dbt-drop-pr-schemas-${{ github.event.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: '0.12.4'

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (incluindo dbt)
        run: uv sync --all-extras --dev

      # A macro roda run_query no BigQuery via ADC (google-github-actions/auth).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Get PR Number
        run: echo "PR_NUM=${{ github.event.number }}" >> $GITHUB_ENV

      - name: DBT Deps
        run: uv run dbt deps --project-dir queries --profiles-dir queries

      # Remove os datasets ci_<PR>__* do ci-recce.yaml no fechamento do PR.
      - name: Drop PR schemas (ci_PR__SHA)
        run: |
          uv run dbt run-operation drop_pr_staging_schemas \
            --args "{'PR_number': '${PR_NUM}'}" \
            --target ci \
            --vars "{'schema_id': '${PR_NUM}__teardown'}" \
            --project-dir queries \
            --profiles-dir queries
