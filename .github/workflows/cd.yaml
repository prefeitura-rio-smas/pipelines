name: CD

on:
  push:
    branches:
      - main
      - 'staging/**'

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: '3.13'

jobs:
  deploy-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Prefect CLI
        run: pip install prefect prefect-docker

      - name: Define Image Metadata
        run: |
          REPO="ghcr.io/${{ github.repository_owner }}/pipelines-rj-smas"
          echo "IMAGE_REPO=${REPO,,}" >> $GITHUB_ENV

          SHA_SHORT=$(git rev-parse --short HEAD)
          REF_NAME="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
             echo "TAG=prod-${SHA_SHORT}" >> $GITHUB_ENV
          else
             BRANCH_NAME="${REF_NAME//\//-}"
             echo "TAG=${BRANCH_NAME}-${SHA_SHORT}" >> $GITHUB_ENV
          fi

      - name: Authenticate Prefect
        run: |
          prefect config set PREFECT_API_URL="${{ secrets.PREFECT_API_URL }}"
          prefect config set PREFECT_API_AUTH_STRING="${{ secrets.PREFECT_API_AUTH_STRING }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_REPO }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Staging Flows
        if: startsWith(github.ref, 'refs/heads/staging/')
        env:
          PREFECT_DEPLOYMENT_IMAGE: "${{ env.IMAGE_REPO }}:${{ env.TAG }}"
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SIURB_URL: ${{ secrets.SIURB_URL }}
          SIURB_USER: ${{ secrets.SIURB_USER }}
          SIURB_PWD: ${{ secrets.SIURB_PWD }}
        run: prefect deploy --name "*-staging"

      - name: Deploy Prod Flows
        if: github.ref == 'refs/heads/main'
        env:
          PREFECT_DEPLOYMENT_IMAGE: "${{ env.IMAGE_REPO }}:${{ env.TAG }}"
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SIURB_URL: ${{ secrets.SIURB_URL }}
          SIURB_USER: ${{ secrets.SIURB_USER }}
          SIURB_PWD: ${{ secrets.SIURB_PWD }}
        run: prefect deploy --name "*-prod"

      - name: Write Job Summary
        if: always()
        run: |
          echo "## CD - ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Imagem**: \`${{ env.IMAGE_REPO }}:${{ env.TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY