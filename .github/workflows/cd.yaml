name: CD

on:
  push:
    branches:
      - main
      - 'staging/**'

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: '3.13'

jobs:
  deploy-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Prefect CLI
        run: pip install prefect prefect-docker

      - name: Define Image Metadata
        run: |
          REPO="ghcr.io/${{ github.repository_owner }}/pipelines-rj-smas"
          echo "IMAGE_REPO=${REPO,,}" >> $GITHUB_ENV

          SHA_SHORT=$(git rev-parse --short HEAD)
          REF_NAME="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
             echo "TAG=prod-${SHA_SHORT}" >> $GITHUB_ENV
          else
             BRANCH_NAME="${REF_NAME//\//-}"
             echo "TAG=${BRANCH_NAME}-${SHA_SHORT}" >> $GITHUB_ENV
          fi

      - name: Authenticate Prefect
        run: |
          prefect config set PREFECT_API_URL="${{ secrets.PREFECT_API_URL }}"
          prefect config set PREFECT_API_AUTH_STRING="${{ secrets.PREFECT_API_AUTH_STRING }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_REPO }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Staging Flows
        if: startsWith(github.ref, 'refs/heads/staging/')
        env:
          PREFECT_DEPLOYMENT_IMAGE: "${{ env.IMAGE_REPO }}:${{ env.TAG }}"
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SIURB_URL: ${{ secrets.SIURB_URL }}
          SIURB_USER: ${{ secrets.SIURB_USER }}
          SIURB_PWD: ${{ secrets.SIURB_PWD }}
        run: prefect deploy --name "*-staging"

      - name: Deploy Prod Flows
        if: github.ref == 'refs/heads/main'
        env:
          PREFECT_DEPLOYMENT_IMAGE: "${{ env.IMAGE_REPO }}:${{ env.TAG }}"
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          SIURB_URL: ${{ secrets.SIURB_URL }}
          SIURB_USER: ${{ secrets.SIURB_USER }}
          SIURB_PWD: ${{ secrets.SIURB_PWD }}
        run: prefect deploy --name "*-prod"

      - name: Write Job Summary
        if: always()
        run: |
          echo "## CD - ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Imagem**: \`${{ env.IMAGE_REPO }}:${{ env.TAG }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Ponto 2 (PR #101): detecção de baseline stale sem acoplar ao deploy.
  # Job INDEPENDENTE do deploy-flows (sem `needs`). A falha do baseline NÃO
  # marca o deploy como falho — ela é o ALERTA visível de baseline stale
  # (job vermelho + GITHUB_STEP_SUMMARY + annotation ::error::).
  # ============================================================================
  recce-prod-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Necessário: `dbt docs generate --target prod` introspecta o catálogo no
      # BigQuery (profiles.yml usa keyfile via GOOGLE_APPLICATION_CREDENTIALS).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Disable recce-cloud telemetry (PostHog opt-out)
        run: |
          # recce-cloud 1.61.0 não tem env var de disable (RECCE_DISABLE_TELEMETRY
          # existe só no pacote OSS `recce`). O mecanismo oficial é a flag
          # anonymous_tracking no ~/.recce/profile.yml — MAS o profile é
          # auto-criado com anonymous_tracking: true (e o host prod usa chave
          # PostHog hardcoded), então sem este passo o upload envia telemetria.
          # Garantimos o opt-out ANTES do primeiro comando recce-cloud.
          mkdir -p "$HOME/.recce"
          profile="$HOME/.recce/profile.yml"
          if [ ! -f "$profile" ] || ! grep -q '^user_id:' "$profile"; then
            # Sem user_id o recce-cloud REGERA o profile com tracking=true.
            printf 'user_id: %s\nanonymous_tracking: false\n' \
              "$(python3 -c 'import uuid; print(uuid.uuid4().hex)')" > "$profile"
          else
            sed -i 's/^anonymous_tracking:.*/anonymous_tracking: false/' "$profile"
            grep -q '^anonymous_tracking:' "$profile" || printf 'anonymous_tracking: false\n' >> "$profile"
          fi
          echo "Recce Cloud telemetry: anonymous_tracking=false em $profile"

      - name: Generate and upload Prod dbt artifacts (Recce baseline)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install uv
          uv sync --all-extras --dev

          run_dbt_artifacts() {
            uv run dbt deps --project-dir queries --profiles-dir queries
            uv run dbt docs generate --target prod --project-dir queries --profiles-dir queries
          }

          run_upload() {
            uv run recce-cloud upload --type prod --target-path queries/target
          }

          # `recce-cloud delete --force` (CLI) NÃO deleta a sessão base: chama
          # delete_with_platform_apis(..., prod=False) (cli.py), que só apaga a
          # sessão PR. Para recriar o baseline preso ('pipelines-base' devolve
          # 409 no touch-recce-session) deletamos a sessão base via API direta
          # (DELETE /api/v2/github/{repo}/session?base=true) e refazemos o upload.
          # SAFETY (PR #110): delete_stuck_base SÓ roda quando o UPLOAD falhou
          # com 409/"already exists" (sessão base presa). Falha de GERAÇÃO dbt
          # (deps/docs) NÃO deleta a base — ela pode estar VÁLIDA e regrediria
          # de stale para AUSENTE.
          delete_stuck_base() {
            uv run python - <<'EOF'
          from recce_cloud.api.factory import create_platform_client
          from recce_cloud.ci_providers import CIDetector

          ci = CIDetector.detect()
          client = create_platform_client(ci.access_token, ci)
          client.delete_session(session_type="prod")
          EOF
          }

          # Passo 1 — geração dos artifacts dbt (deps + docs generate).
          # Se falhou: alerta SEM deletar a sessão base (a base pode estar válida).
          if ! run_dbt_artifacts; then
            echo "::error::Recce baseline de prod não gerado (dbt deps/docs) — sessão base NÃO alterada"
            {
              echo "## ⚠️ Recce baseline de prod NÃO gerado"
              echo ""
              echo "A geração dos artifacts dbt (\`dbt deps\` / \`dbt docs generate\`) falhou."
              echo "A sessão base do Recce Cloud foi **PRESERVADA** (falha não é 409 de sessão presa)."
              echo ""
              echo "- **Job**: \`recce-prod-baseline\` (independente do \`deploy-flows\` — release não afetado)"
              echo "- **Commit**: \`${{ github.sha }}\`"
              echo "- **Diagnóstico**: revisar os logs do \`dbt deps\`/\`dbt docs generate\` acima."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Passo 2 — upload do baseline. Self-healing SÓ no 409/"already exists":
          # deleta a sessão base presa e retenta 1x. Qualquer outra falha de upload
          # (rede, auth, etc.) é alerta SEM deletar a base.
          if ! upload_log=$(run_upload 2>&1); then
            if grep -qiE '409|already exists' <<< "$upload_log"; then
              {
                echo "## ⚠️ Recce baseline de prod com sessão presa (409) — recriando"
                echo ""
                echo "O primeiro \`recce-cloud upload --type prod\` falhou com 409 (sessão"
                echo "'pipelines-base' presa). Removendo a sessão base via API direta e retentando 1x..."
              } >> "$GITHUB_STEP_SUMMARY"

              # Remove a sessão base presa e recria do zero. `|| true`: 404 sem
              # sessão não é erro.
              if ! delete_stuck_base; then
                echo "::error::Falha ao deletar a sessão base presa do Recce Cloud"
              fi

              if ! upload_log=$(run_upload 2>&1); then
                echo "::error::Recce baseline de prod falhou (stale) — upload de artifacts não atualizou o baseline mesmo após recriar a sessão base"
                {
                  echo "## ⚠️ Recce baseline de prod NÃO atualizado (stale)"
                  echo ""
                  echo "A geração/upload dos artifacts de prod (\`recce-cloud upload --type prod\`) falhou"
                  echo "mesmo após recriar a sessão base. Os próximos data reviews de PR vão comparar"
                  echo "contra um baseline **desatualizado**."
                  echo ""
                  echo "- **Job**: \`recce-prod-baseline\` (independente do \`deploy-flows\` — release não afetado)"
                  echo "- **Commit**: \`${{ github.sha }}\`"
                  echo "- **Diagnóstico**: revisar os logs dos passos \`dbt\`/\`recce-cloud\` acima e a conectividade com o Recce Cloud."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            else
              echo "::error::Recce upload de prod falhou (sem 409) — sessão base PRESERVADA"
              {
                echo "## ⚠️ Recce baseline de prod NÃO atualizado (upload falhou sem 409)"
                echo ""
                echo "O \`recce-cloud upload --type prod\` falhou por motivo NÃO relacionado a"
                echo "sessão presa (409). A sessão base foi **PRESERVADA**."
                echo ""
                echo "- **Commit**: \`${{ github.sha }}\`"
                echo "- **Log do erro**:"
                echo "\`\`\`"
                echo "$upload_log"
                echo "\`\`\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

          {
            echo "✅ Recce baseline de prod atualizado (\`upload --type prod\`)."
          } >> "$GITHUB_STEP_SUMMARY"
